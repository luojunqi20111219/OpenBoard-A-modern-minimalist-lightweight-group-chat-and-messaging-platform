name: Build Windows Client

# 为什么这个工作流以前不存在
# ---------------------------------------------------------------------------
# 项目里一直有 main.cpp（Win32 + WebView2），但仓库只有 Linux / macOS / iOS /
# Android 四个工作流，**唯独没有 Windows** —— 所以 exe 从来没被生产过。
#
# 而且 exe 只能在 Windows 上编：
#   main.cpp 用了 webview.h 并在开头定义 WEBVIEW_MSWEBVIEW2_EXPLICIT_LINK，
#   这是 MSVC + WebView2 SDK 的显式链接模式，Linux 的 MinGW 交叉编译
#   既没有 Windows SDK 也没有 WebView2 的头/库，物理上做不出来。
on:
  push:
    tags: [ "v*" ]
    branches: [ "main", "master" ]
    paths:
      - "main.cpp"
      - "webview.h"
      - "resource.rc"
      - "resource.o"
      - "webview2_sdk/**"
      - ".github/workflows/build_windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      # ⚠️ Windows 默认路径上限 260 字符，而仓库里有游戏资源
      # （tomalbran-pacman 的 animations、08-Rock-Paper-Scissors 的 images 等）
      # 会超过这个限制，checkout 阶段就报 "Filename too long" 直接失败。
      #
      # 已经踩过两个坑，记下来免得再踩：
      #  1. 注册表 LongPathsEnabled **必须重启/重开进程**才对已运行的进程生效。
      #     GitHub 的 run 步骤调度器是常驻服务，跑到后面 checkout 时它仍然是
      #     旧策略，所以只写注册表**并不够**。
      #  2. `git config --system core.longpaths true` 在 hosted runner 上会因
      #     权限问题静默不生效（runner 用户对全局 gitconfig 不一定可写）。
      #
      # 真正稳的做法是**用环境变量**：GIT_CONFIG_COUNT / GIT_CONFIG_KEY_0 /
      # GIT_CONFIG_VALUE_0。Git ≥2.31 原生支持，对所有 git 子进程生效、
      # 不依赖写文件、不依赖权限，且**先于 checkout 生效**。
      # 三重保险一起上。
      - name: Enable long paths (Windows)
        shell: pwsh
        run: |
          # (1) 环境变量：立即对所有后续 git 进程生效
          "GIT_CONFIG_COUNT=1"          | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GIT_CONFIG_KEY_0=core.longpaths" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GIT_CONFIG_VALUE_0=true"     | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # (2) 注册表：让 Win32 API 也接受长路径（工具链可能依赖）
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null

          # (3) 顺手写一下 gitconfig（失败不致命，前面两条已经兜住了）
          try { git config --system core.longpaths true } catch { Write-Host "系统级 gitconfig 写入被拒，已有环境变量兜底" }

          Write-Host "已启用长路径支持（环境变量 + 注册表 + gitconfig）"
          git config --list --show-origin 2>$null | Select-String "longpaths"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # 再兜一层：checkout action 内部也读这块配置
          fetch-depth: 1

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME}"
          else
            V="v0.0.0-dev+${GITHUB_SHA::7}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "解析到版本号：$V"

      # 仓库里 webview2_sdk 是一个解开的 nuget 包，真实路径是：
      #   webview2_sdk/build/native/include/WebView2.h
      #   webview2_sdk/build/native/x64/WebView2LoaderStatic.lib
      # 下面按这两个路径探测；万一缺失才回退 nuget 拉包。
      - name: Ensure WebView2 SDK
        shell: pwsh
        run: |
          $inc = "webview2_sdk/build/native/include"
          $lib = "webview2_sdk/build/native/x64"
          if ((Test-Path "$inc/WebView2.h") -and (Test-Path "$lib/WebView2LoaderStatic.lib")) {
            Write-Host "仓库自带 WebView2 SDK，路径确认无误"
          } else {
            Write-Host "未找到 WebView2 头/库，改用 nuget 拉取官方包"
            nuget install Microsoft.Web.WebView2 -OutputDirectory pkgs -Version 1.0.2210.55
            $pkg = Get-ChildItem pkgs -Directory -Filter "Microsoft.Web.WebView2*" | Select-Object -First 1
            New-Item -ItemType Directory -Force -Path $inc | Out-Null
            New-Item -ItemType Directory -Force -Path $lib | Out-Null
            Copy-Item "$($pkg.FullName)/build/native/include/*" $inc -Recurse -Force
            Copy-Item "$($pkg.FullName)/build/native/x64/*"     $lib -Recurse -Force
          }
          Get-ChildItem "$inc" -File | Select-Object Name
          Get-ChildItem "$lib" -File | Select-Object Name

      # ⚠️ 这里**必须**写成 .bat 再 cmd /c 调用，不能把编译器命令塞进
      # PowerShell 的 here-string 里 —— 踩过的坑：
      #   把 cl 命令放在 `$cmd = @"..."@` 里再 `cmd /c $cmd`，编译器自身的
      #   输出（cl 的 banner、错误、rc 的报错）会全部被 PowerShell 吞掉，
      #   日志里只剩一行 "编译失败：没有产出 OpenBoard.exe"，
      #   完全看不出到底是缺头文件、缺库还是 cl 根本找不到 → 无法排障。
      # 写成独立的 .bat 文件后，输出原样进 stdout，错误一目了然。
      - name: Build EXE with MSVC
        shell: pwsh
        run: |
          # 用 vswhere 定位 VS 自带的编译环境，再调 cl.exe。
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          # ⚠️ 必须 [string] 强转 + Trim()。
          # vswhere 的输出在被 PowerShell 捕获时是**字符串数组**（每行一个元素），
          # 即使只有一行也是数组。数组参与字符串拼接时 PowerShell 默认用
          # **换行**当分隔符，于是
          #     'set "VCVARS=' + $vcvars + '"'
          # 会写成三行：
          #     set "VCVARS=
          #     C:\Program Files\...\vcvars64.bat
          #     "
          # cmd 拿到就报 'C:\Program' is not recognized as an internal
          # or external command —— 这轮排查里坑了两次的元凶。
          $vsRaw = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vsPath = ([string]$vsRaw).Trim()
          Write-Host "Visual Studio: $vsPath"
          if ([string]::IsNullOrWhiteSpace($vsPath)) { throw "没有找到带 C++ 工具集的 Visual Studio" }

          $vcvars = ([string](Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat")).Trim()
          if (-not (Test-Path $vcvars)) { throw "找不到 vcvars64.bat：$vcvars" }
          Write-Host "vcvars64: $vcvars"

          # main.cpp 里 LoadIconW(GetModuleHandleW(NULL), MAKEINTRESOURCEW(101))
          # 要求把 resource.rc 一起编进去，否则 exe 没有图标。
          # rc.exe 在 vcvars 环境里已可用。
          #
          # ⚠️ 这段 .bat 的引号也用得很有讲究，别"简化"：
          #   1) `set "VCVARS=<path>"` 等号左侧整体加引号 —— set 的规范写法，
          #      能容纳含空格的路径
          #   2) `call "%VCVARS%"` —— 变量带引号展开
          #   3) `if errorlevel 1 (...)` 取代 `||` —— `||` 紧跟在引号后面时
          #      cmd 的引号配对会剥错位，把 " 和 C:\Program 当成两条命令
          #   4) 不写中文错误文案 —— .bat 以 ASCII 落盘，中文会变 ???
          $bat = @(
            '@echo off',
            'setlocal enableextensions',
            'set "VCVARS=' + $vcvars + '"',
            'echo === vcvars64 ===',
            'call "%VCVARS%"',
            'if errorlevel 1 ( echo ::error::vcvars64 init failed & exit /b 1 )',
            'echo === rc.exe ===',
            'rc /nologo resource.rc',
            'if errorlevel 1 ( echo ::error::rc failed & exit /b 1 )',
            'echo === cl.exe ===',
            'cl /nologo /std:c++17 /O2 /EHsc /DUNICODE /D_UNICODE ' +
              '/I"webview2_sdk\build\native\include" ' +
              'main.cpp resource.res ' +
              '/Fe:OpenBoard.exe ' +
              '/link /SUBSYSTEM:WINDOWS ' +
              '/LIBPATH:"webview2_sdk\build\native\x64" ' +
              'WebView2LoaderStatic.lib ' +
              'user32.lib shell32.lib ole32.lib oleaut32.lib advapi32.lib gdi32.lib',
            'if errorlevel 1 ( echo ::error::cl failed & exit /b 1 )',
            'echo === cl done ===',
            'exit /b 0'
          )
          # ⚠️ 编码用 OEM(437)，不是 ASCII。
          # cmd.exe 在中文/其他代码页下读 UTF-8 或 ANSI 落盘的 .bat 可能
          # 把路径里的字符读坏；OEM 是 cmd 的原生编码，最稳。
          $bat -join "`r`n" | Set-Content -Path build_exe.bat -Encoding OEM
          Write-Host "--- build_exe.bat ---"
          Get-Content build_exe.bat | ForEach-Object { Write-Host "  $_" }
          Write-Host "---------------------"

          cmd /c build_exe.bat
          $code = $LASTEXITCODE
          Write-Host "build_exe.bat 退出码：$code"

          if (-not (Test-Path "OpenBoard.exe")) { throw "编译失败：没有产出 OpenBoard.exe（退出码 $code）" }
          Get-Item OpenBoard.exe | Format-List Name,Length

      - name: Package ZIP
        shell: pwsh
        run: |
          $V = "${{ steps.ver.outputs.version }}"
          $dir = "OpenBoard-Windows-$V"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item OpenBoard.exe $dir/
          # 图标（有就带上，没有不致命）
          $ico = "OpenBoardHarmony/entry/src/main/resources/base/media/app_icon.png"
          if (Test-Path $ico) { Copy-Item $ico "$dir/icon.png" }

          # 说明文件用字符串数组拼，别用 @"..."@ here-string ——
          # 它的结束标记必须顶格写，会把 YAML 的 run: | 块标量截断。
          $lines = @(
            "OpenBoard 桌面端（Windows）",
            "版本：$V",
            "",
            "双击 OpenBoard.exe 运行。",
            "首次启动需要系统已安装 WebView2 Runtime",
            "（Win10/11 一般自带；若缺少，程序会提示下载）。"
          )
          $lines -join "`r`n" | Out-File -Encoding UTF8 "$dir/使用说明.txt"

          Compress-Archive -Path $dir/* -DestinationPath "$dir.zip" -Force
          Get-Item "$dir.zip" | Format-List Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenBoard-Windows-EXE
          path: OpenBoard-Windows-${{ steps.ver.outputs.version }}.zip
          retention-days: 30

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "OpenBoard-Windows-${{ steps.ver.outputs.version }}.zip" --clobber
