name: Build Android Client

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build Release APK
        working-directory: OpenBoardAndroid
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp build2/outputs/apk/release/app-release.apk ../OpenBoard-Android-v7.6.0.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenBoard-Android-v7.6.0
          path: OpenBoard-Android-v7.6.0.apk

      - name: Upload Android Build to Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" OpenBoard-Android-v7.6.0.apk --clobber
