name: Build Linux Web Client

# 说明
# ---------------------------------------------------------------------------
# Linux 桌面端与 macOS 共用同一份 main.cpp（webview.h 抽象层），
# 只是后端换成 GTK + WebKitGTK。
on:
  push:
    tags: [ "v*" ]
    branches: [ "main", "master" ]
    paths:
      - "main.cpp"
      - ".github/workflows/build_linux.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 版本号动态解析 —— 之前在 .desktop 里写死 7.7.0
      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME}"
          else
            V="v0.0.0-dev+${GITHUB_SHA::7}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "解析到版本号：$V"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # webkit2gtk-4.1 在 ubuntu-24.04 runner 上是可用包名；
          # 若换到 22.04 需改成 4.0。这里两个都试，避免 runner 升级后断掉。
          sudo apt-get install -y libgtk-3-dev build-essential pkg-config || true
          sudo apt-get install -y libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Compile Linux Executable
        run: |
          PKG=$(pkg-config --exists webkit2gtk-4.1 && echo webkit2gtk-4.1 || echo webkit2gtk-4.0)
          echo "使用 $PKG"
          g++ -std=c++17 -O3 main.cpp \
            $(pkg-config --cflags --libs gtk+-3.0 $PKG) \
            -o OpenBoard
          ls -la OpenBoard

      - name: Create Linux App Directory Structure
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p OpenBoard-Linux/bin
          mkdir -p OpenBoard-Linux/share/applications
          mkdir -p OpenBoard-Linux/share/pixmaps

          cp OpenBoard OpenBoard-Linux/bin/

          ICON=OpenBoardHarmony/entry/src/main/resources/base/media/app_icon.png
          if [ -f "$ICON" ]; then
            cp "$ICON" OpenBoard-Linux/share/pixmaps/openboard.png
          else
            echo "::warning::未找到图标 $ICON，跳过"
          fi

          # heredoc 不加引号，让 ${APP_VERSION} 展开。
          # 注意缩进：<<EOF 后面的内容顶格写，否则 .desktop 里会带上空格
          # 导致 Exec 路径解析异常。
          cat > OpenBoard-Linux/share/applications/openboard.desktop <<EOF
          [Desktop Entry]
          Version=${APP_VERSION}
          Name=信语 OpenBoard
          Comment=OpenBoard Desktop client
          Exec=openboard
          Icon=openboard
          Terminal=false
          Type=Application
          Categories=Network;InstantMessaging;
          EOF

          cat > OpenBoard-Linux/README.txt <<EOF
          OpenBoard 桌面端（Linux）
          版本：${APP_VERSION}

          解压后可直接运行 bin/OpenBoard。
          需要系统已安装 GTK3 与 WebKitGTK 运行库。
          EOF

      - name: Compress Linux Build
        run: |
          V="${{ steps.ver.outputs.version }}"
          tar -czf "OpenBoard-Linux-${V}.tar.gz" OpenBoard-Linux
          ls -la OpenBoard-Linux-*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenBoard-Linux
          path: OpenBoard-Linux-*.tar.gz
          retention-days: 30

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" OpenBoard-Linux-*.tar.gz --clobber
