name: Build Linux Web Client

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config

    - name: Compile Linux Executable
      run: |
        g++ -std=c++11 -O3 main.cpp $(pkg-config --cflags --libs gtk+-3.0 webkit2gtk-4.0) -o OpenBoard

    - name: Create Linux App Directory Structure
      run: |
        mkdir -p OpenBoard-Linux/bin
        mkdir -p OpenBoard-Linux/share/applications
        mkdir -p OpenBoard-Linux/share/pixmaps
        
        cp OpenBoard OpenBoard-Linux/bin/
        cp OpenBoardHarmony/entry/src/main/resources/base/media/app_icon.png OpenBoard-Linux/share/pixmaps/openboard.png

        # Create desktop launcher entry
        cat <<EOF > OpenBoard-Linux/share/applications/openboard.desktop
        [Desktop Entry]
        Version=7.0
        Name=信语 OpenBoard
        Comment=OpenBoard Desktop client
        Exec=openboard
        Icon=openboard
        Terminal=false
        Type=Application
        Categories=Network;InstantMessaging;
        EOF

    - name: Compress Linux Build
      run: |
        tar -czvf OpenBoard-Linux.tar.gz OpenBoard-Linux

    - name: Upload Linux Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenBoard-Linux
        path: OpenBoard-Linux.tar.gz
