name: Build iOS Client

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create iOS Platform Folder
        run: |
          cd OpenBoardFlutter
          flutter create --platforms=ios .

      - name: Configure iOS Permissions and Deployment Target
        run: |
          python3 -c "
          import re
          # 1. Add camera and photo permissions to Info.plist
          plist_path = 'OpenBoardFlutter/ios/Runner/Info.plist'
          with open(plist_path, 'r') as f:
              content = f.read()
          permission_keys = '''
              <key>NSCameraUsageDescription</key>
              <string>我们需要您的相机权限来扫描二维码。</string>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>我们需要您的相册权限来识别相册中的二维码。</string>
          '''
          if '</dict>' in content:
              content = content.replace('</dict>', permission_keys + '</dict>', 1)
              with open(plist_path, 'w') as f:
                  f.write(content)

          # 2. Update Podfile deployment target to 13.0 (required by mobile_scanner)
          podfile_path = 'OpenBoardFlutter/ios/Podfile'
          with open(podfile_path, 'r') as f:
              p_content = f.read()
          p_content = re.sub(r'#\s*platform :ios,\s*\'\d+\.\d+\'', 'platform :ios, \'13.0\'', p_content)
          p_content = re.sub(r'platform :ios,\s*\'\d+\.\d+\'', 'platform :ios, \'13.0\'', p_content)
          with open(podfile_path, 'w') as f:
              f.write(p_content)

          # 3. Update project.pbxproj deployment target to 13.0
          proj_path = 'OpenBoardFlutter/ios/Runner.xcodeproj/project.pbxproj'
          with open(proj_path, 'r') as f:
              proj_content = f.read()
          proj_content = proj_content.replace('IPHONEOS_DEPLOYMENT_TARGET = 11.0', 'IPHONEOS_DEPLOYMENT_TARGET = 13.0')
          proj_content = proj_content.replace('IPHONEOS_DEPLOYMENT_TARGET = 12.0', 'IPHONEOS_DEPLOYMENT_TARGET = 13.0')
          with open(proj_path, 'w') as f:
              f.write(proj_content)
          "

      - name: Get Dependencies
        run: |
          cd OpenBoardFlutter
          flutter pub get

      - name: Build iOS App (Unsigned)
        run: |
          cd OpenBoardFlutter
          flutter build ios --no-codesign

      - name: Pack App into IPA
        run: |
          mkdir -p build-output
          cd OpenBoardFlutter/build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r ../../../build-output/OpenBoard-iOS-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenBoard-iOS-Unsigned
          path: build-output/OpenBoard-iOS-Unsigned.ipa
