name: Build iOS Client

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: |
          cd OpenBoardFlutter
          flutter pub get

      - name: Build iOS App (Unsigned)
        run: |
          cd OpenBoardFlutter
          flutter build ios --no-codesign

      - name: Pack App into IPA
        run: |
          mkdir -p build-output
          cd OpenBoardFlutter/build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r ../../../build-output/OpenBoard-iOS-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenBoard-iOS-Unsigned
          path: build-output/OpenBoard-iOS-Unsigned.ipa
