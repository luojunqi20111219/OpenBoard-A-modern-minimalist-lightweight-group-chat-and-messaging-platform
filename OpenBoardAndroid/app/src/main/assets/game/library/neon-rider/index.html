<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>霓虹狂飙：逆波公路 (Neon Rider: Synthwave Highway)</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --neon-blue: #00f0ff;
            --neon-pink: #ff007f;
            --neon-purple: #a855f7;
            --neon-yellow: #ffdf00;
            --bg-dark: #02000a;
            --panel-bg: rgba(6, 4, 20, 0.75);
            --border-glow: rgba(255, 0, 127, 0.25);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            background-color: #03000f;
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.15);
        }

        /* HUD Overlay */
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-family: 'Orbitron', sans-serif;
            z-index: 10;
        }

        .hud-item {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            padding: 10px 20px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.15);
        }

        .hud-val {
            color: var(--neon-blue);
            font-weight: 700;
            font-size: 20px;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }

        .hud-speed {
            color: var(--neon-yellow);
            font-weight: 700;
            font-size: 20px;
            text-shadow: 0 0 8px rgba(255, 223, 0, 0.5);
        }

        .hud-energy-bar {
            width: 120px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        .hud-energy-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            transition: width 0.1s;
            box-shadow: 0 0 8px var(--neon-blue);
        }

        /* Screens Overlay */
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 0, 8, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s;
        }

        .hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        .menu-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.2);
            animation: panelFadeIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes panelFadeIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--neon-pink) 0%, var(--neon-purple) 50%, var(--neon-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255, 0, 127, 0.4));
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 16px;
            color: var(--text-muted, #a7b3d8);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 35px;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #cc0066, #990066);
            border: 1px solid rgba(255, 0, 127, 0.4);
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--neon-pink);
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            border-color: #fff;
        }

        .btn-settings {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-muted, #a7b3d8);
            box-shadow: none;
        }

        .btn-settings:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
            transform: none;
            box-shadow: none;
        }

        /* Score Board */
        .score-list {
            margin: 20px 0;
            padding: 0;
            list-style: none;
            text-align: left;
        }

        .score-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 15px;
        }

        .score-item:last-child {
            border-bottom: none;
        }

        .score-item .rank {
            color: var(--neon-pink);
            font-weight: bold;
            margin-right: 10px;
        }

        .score-item .val {
            color: var(--neon-blue);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
        }

        /* Controls Tip */
        .controls-tip {
            font-size: 13px;
            color: var(--text-muted, #6b7280);
            margin-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
            display: flex;
            justify-content: space-around;
        }

        .controls-tip i {
            margin-right: 4px;
            color: var(--neon-pink);
        }

        /* Volume Controls */
        .volume-control {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 1000;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .volume-control:hover {
            box-shadow: 0 0 10px var(--neon-pink);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Game HUD -->
    <div class="hud">
        <div class="hud-item">
            <i class="fa-solid fa-gauge-simple-high" style="color: var(--neon-yellow);"></i>
            <span class="hud-speed" id="hud-speed-val">0 KM/H</span>
        </div>
        <div class="hud-item">
            <i class="fa-solid fa-trophy" style="color: var(--neon-pink);"></i>
            <span class="hud-val" id="hud-score-val">000000</span>
        </div>
        <div class="hud-item">
            <div class="hud-energy-bar">
                <div class="hud-energy-fill" id="hud-energy-fill"></div>
            </div>
            <i class="fa-solid fa-bolt" style="color: var(--neon-blue);"></i>
        </div>
    </div>

    <!-- Start Screen -->
    <div class="screen-overlay" id="start-screen">
        <div class="menu-panel">
            <div class="title">NEON RIDER</div>
            <div class="subtitle">霓虹狂飙：逆波公路</div>
            
            <button class="btn" id="start-btn">
                <i class="fa-solid fa-car-on"></i> 点火发动
            </button>
            
            <button class="btn btn-settings" id="controls-btn">
                <i class="fa-solid fa-keyboard"></i> 左右键 / 触屏拖拽 避障
            </button>

            <div class="score-list">
                <div style="font-weight: 700; margin-bottom: 8px; color: var(--neon-pink); text-align: center;">🏁 历史最高里程</div>
                <div id="high-scores-container">
                    <div style="text-align: center; color: var(--text-muted, #a7b3d8); font-size: 13px; padding: 10px;">暂无行车纪录，油门已备好！</div>
                </div>
            </div>

            <div class="controls-tip">
                <span><i class="fa-solid fa-arrows-left-right"></i> AD / 左右键 / 拖拽 控制左右</span>
                <span><i class="fa-solid fa-bolt"></i> 拾取闪电充能，撞击红墙减速</span>
            </div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div class="screen-overlay hidden" id="gameover-screen">
        <div class="menu-panel">
            <div class="title" style="background: linear-gradient(135deg, var(--neon-pink) 0%, var(--neon-purple) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px rgba(255, 0, 127, 0.4));">ENGINE STALLED</div>
            <div class="subtitle" style="color: var(--neon-pink);">引擎熄火 / 能量耗尽</div>

            <div style="margin-bottom: 25px;">
                <div style="font-size: 16px; color: var(--text-muted, #a7b3d8);">行驶里程</div>
                <div style="font-size: 40px; font-weight: 900; font-family: 'Orbitron', sans-serif; color: var(--neon-blue); text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);" id="final-score">0 M</div>
                <div style="font-size: 14px; color: var(--neon-purple); margin-top: 5px;" id="new-high-score-label"></div>
            </div>
            
            <button class="btn" id="restart-btn">
                <i class="fa-solid fa-car-burst"></i> 重新发动
            </button>
            <button class="btn btn-settings" id="back-to-menu-btn">
                <i class="fa-solid fa-house"></i> 返回停车场
            </button>
        </div>
    </div>

    <!-- Audio Toggle -->
    <div class="volume-control" id="volume-toggle" title="开启/关闭声音">
        <i class="fa-solid fa-volume-high" id="volume-icon" style="color: var(--neon-pink); font-size: 18px;"></i>
    </div>

    <!-- Game Canvas -->
    <canvas id="game-canvas"></canvas>
</div>

<script>
    // ---------- 浏览器自适应设置 ----------
    const canvas = document.getElementById("game-canvas");
    const ctx = canvas.getContext("2d");

    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    window.addEventListener("resize", () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    });

    // ---------- 音频生成系统 (Web Audio API) ----------
    let audioEnabled = true;
    let audioCtx = null;
    let engineOsc = null;
    let engineGain = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    const volumeToggle = document.getElementById("volume-toggle");
    const volumeIcon = document.getElementById("volume-icon");

    volumeToggle.addEventListener("click", () => {
        audioEnabled = !audioEnabled;
        if (audioEnabled) {
            volumeIcon.className = "fa-solid fa-volume-high";
            initAudio();
            if (gameState === "playing") startEngineSound();
        } else {
            volumeIcon.className = "fa-solid fa-volume-xmark";
            stopEngineSound();
        }
    });

    // 引擎发动机持续嗡鸣音效
    function startEngineSound() {
        if (!audioEnabled || engineOsc) return;
        initAudio();
        try {
            engineOsc = audioCtx.createOscillator();
            engineGain = audioCtx.createGain();
            
            // 使用低沉的三角波/锯齿波合成引擎声
            engineOsc.type = 'sawtooth';
            engineOsc.frequency.value = 45; // 初始低频
            
            // 低通滤波器过滤掉刺耳的高频，得到低沉的声音
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 160;

            engineOsc.connect(filter);
            filter.connect(engineGain);
            engineGain.connect(audioCtx.destination);

            engineGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            engineOsc.start();
        } catch(e) {}
    }

    function updateEnginePitch(speedRatio) {
        if (engineOsc && audioEnabled) {
            // 根据速度调节发动机音调（频率在 45Hz - 110Hz 之间起伏）
            engineOsc.frequency.setValueAtTime(45 + speedRatio * 75, audioCtx.currentTime);
            // 速度越快，引擎越抖动（声音振幅增加一点）
            engineGain.gain.setValueAtTime(0.04 + speedRatio * 0.03, audioCtx.currentTime);
        }
    }

    function stopEngineSound() {
        if (engineOsc) {
            try {
                engineOsc.stop();
                engineOsc.disconnect();
            } catch(e) {}
            engineOsc = null;
        }
    }

    // 拾取能量音效
    function playCollectSound() {
        if (!audioEnabled) return;
        initAudio();
        try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now); // C5
            osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.15); // C6
            
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            
            osc.start(now);
            osc.stop(now + 0.15);
        } catch(e) {}
    }

    // 撞击爆炸音效
    function playCrashSound() {
        if (!audioEnabled) return;
        initAudio();
        try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.linearRampToValueAtTime(30, now + 0.3);
            
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            
            osc.start(now);
            osc.stop(now + 0.3);
        } catch(e) {}
    }

    // ---------- 粒子特效类 ----------
    class SparkParticle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.size = Math.random() * 3 + 1.5;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 6 + 2;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.alpha = 1;
            this.decay = Math.random() * 0.03 + 0.02;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= this.decay;
        }

        draw(ctx) {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.shadowBlur = 8;
            ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    // ---------- 游戏核心变量 ----------
    let score = 0; // 行驶里程
    let energy = 100; // 能量值 (当能量归零时游戏结束)
    let speed = 0; // 当前车速 (像素/帧)
    const maxSpeed = 16; // 最大速度
    let distanceTraveled = 0; // 累计行车位移 (用于线条动画)
    let gameState = "start"; // start, playing, gameover
    let screenShake = 0;
    
    // 玩家赛车
    let player = {
        x: 0, // 屏幕相对位置，范围 [-1, 1]，0表示居中
        targetX: 0,
        width: 70,
        height: 36,
        steerAngle: 0 // 车体倾斜度
    };

    let stars = [];
    let mountains = [];
    let roadElements = []; // 包含障碍物和能量道具
    let particles = [];

    const horizonY = height * 0.55; // 视平线高度 (天地分界)
    const roadWidthAtBottom = width * 0.8;
    const roadWidthAtHorizon = 12;

    // 初始化视差群山背景
    function initMountains() {
        mountains = [];
        let points = 25;
        let step = width / (points - 1);
        
        // 远山 (暗紫色)
        let farLayer = [];
        for (let i = 0; i < points; i++) {
            farLayer.push({
                x: i * step,
                y: horizonY - (Math.random() * 70 + 40)
            });
        }
        mountains.push({ points: farLayer, color: '#1a0033', speed: 0.1 });

        // 近山 (带亮色霓虹边框)
        let nearLayer = [];
        for (let i = 0; i < points; i++) {
            nearLayer.push({
                x: i * step,
                y: horizonY - (Math.random() * 45 + 15)
            });
        }
        mountains.push({ points: nearLayer, color: '#2a004d', strokeColor: '#a855f7', speed: 0.25 });
    }

    // 初始化星空
    function initStars() {
        stars = [];
        for (let i = 0; i < 80; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * horizonY,
                size: Math.random() * 1.5 + 0.5,
                color: Math.random() > 0.5 ? '#ff007f' : '#00f0ff'
            });
        }
    }

    // 键盘动作监听
    const keys = {};
    window.addEventListener("keydown", (e) => { keys[e.code] = true; });
    window.addEventListener("keyup", (e) => { keys[e.code] = false; });

    // 鼠标/触屏 拖拽控制
    let isDragging = false;
    window.addEventListener("mousedown", (e) => { isDragging = true; });
    window.addEventListener("mouseup", () => { isDragging = false; });
    window.addEventListener("mousemove", (e) => {
        if (gameState !== "playing") return;
        // 将鼠标的 X 坐标映射到 [-1.2, 1.2]
        const relX = (e.clientX / width) * 2 - 1;
        player.targetX = relX * 1.35;
    });

    window.addEventListener("touchmove", (e) => {
        if (gameState !== "playing") return;
        if (e.touches.length > 0) {
            const relX = (e.touches[0].clientX / width) * 2 - 1;
            player.targetX = relX * 1.35;
        }
    }, { passive: true });

    // 生成道具或障碍物在路尽头
    let elementSpawnTimer = 0;
    function spawnRoadElement() {
        elementSpawnTimer--;
        if (elementSpawnTimer <= 0) {
            elementSpawnTimer = Math.max(12, 45 - Math.floor(speed * 1.5)); // 车速越快，生成频率越高

            const rand = Math.random();
            let type = 'obstacle'; // 障碍物
            let color = '#ff007f'; // 玫红霓虹
            let value = 0;

            if (rand < 0.35) {
                type = 'energy'; // 闪电能量
                color = '#00f0ff'; // 青蓝霓虹
            }

            // 随机分布在三条赛道上 (-1 左，0 中，1 右)
            const lane = Math.floor(Math.random() * 3) - 1; 

            roadElements.push({
                z: 100, // 从地平线深处 (100) 开始逼近 (0)
                lane: lane,
                type: type,
                color: color,
                width: 25,
                height: 25,
                angle: Math.random() * Math.PI // 仅仅用于能量块旋转
            });
        }
    }

    // ---------- 更新游戏状态 ----------
    function update() {
        if (gameState !== "playing") return;

        // 1. 缓慢自动减少能量 (相当于燃油消耗，车速越快消耗越少/按时间匀速消耗)
        energy = Math.max(0, energy - 0.08);
        if (energy <= 0) {
            triggerGameOver();
            return;
        }

        // 2. 车速渐进逻辑
        if (keys["KeyW"] || keys["ArrowUp"]) {
            speed = Math.min(maxSpeed, speed + 0.15); // 油门
        } else if (keys["KeyS"] || keys["ArrowDown"]) {
            speed = Math.max(0, speed - 0.3); // 刹车
        } else {
            // 怠速，无操作时车速维持在中等
            const targetIdle = maxSpeed * 0.6;
            if (speed < targetIdle) speed = Math.min(targetIdle, speed + 0.05);
            else speed = Math.max(targetIdle, speed - 0.08);
        }

        // 累积行驶里程
        distanceTraveled += speed;
        score += Math.floor(speed / 4);

        // 传递引擎音调
        updateEnginePitch(speed / maxSpeed);

        // 3. 赛车转向控制
        let steerDir = 0;
        if (keys["KeyA"] || keys["ArrowLeft"]) {
            player.targetX = Math.max(-1.3, player.targetX - 0.06);
            steerDir = -1;
        } else if (keys["KeyD"] || keys["ArrowRight"]) {
            player.targetX = Math.min(1.3, player.targetX + 0.06);
            steerDir = 1;
        }

        // 平滑追踪目标 X 坐标
        const oldX = player.x;
        player.x += (player.targetX - player.x) * 0.18;
        
        // 计算转向倾斜偏角
        player.steerAngle = (player.x - oldX) * 1.5;

        // 4. 视差群山滚动逻辑 (配合玩家倾斜移动)
        const moveDelta = (player.x - oldX) * width * 0.15;
        mountains.forEach(layer => {
            layer.points.forEach(p => {
                p.x -= moveDelta * layer.speed;
                // 循环循环
                if (p.x < -100) p.x += width + 200;
                if (p.x > width + 100) p.x -= width + 200;
            });
        });

        // 5. 更新障碍物与道具的 3D 移动
        spawnRoadElement();
        for (let i = roadElements.length - 1; i >= 0; i--) {
            const el = roadElements[i];
            
            // 随着车速向玩家逼近 (z轴减少)
            el.z -= (speed * 0.12 + 0.8);

            // 当物体滑过玩家身后
            if (el.z <= 0) {
                roadElements.splice(i, 1);
                continue;
            }

            // 3D 投影到 2D 坐标系
            const scale = 1.0 / el.z;
            const roadW = roadWidthAtHorizon + (roadWidthAtBottom - roadWidthAtHorizon) * (1 - el.z / 100);
            
            // 计算车道中心偏移
            const laneCenterOffset = el.lane * (roadW * 0.32);
            const elX = width / 2 + laneCenterOffset - (player.x * roadW * 0.28); 
            const elY = horizonY + (height - horizonY) * Math.pow(1 - el.z / 100, 2.5); // 曲线透视下落

            const elSize = 250 * scale; // 尺寸放大

            // 碰撞判定范围 (当 Z 轴小于 8 并且在赛车附近时判定)
            if (el.z < 8 && el.z > 1.5) {
                // 将赛车中心与物体中心对比 (相对距离判断)
                const carScreenX = width / 2; // 赛车始终画在中央（通过镜头位移差模拟）
                const distanceX = Math.abs(elX - carScreenX);
                const carScreenY = height - 70;

                if (distanceX < (player.width / 2 + elSize * 0.8) && elY > (carScreenY - 15) && elY < (carScreenY + 30)) {
                    // 发生碰撞！
                    if (el.type === 'obstacle') {
                        // 撞上红墙障
                        playCrashSound();
                        screenShake = 16;
                        energy = Math.max(0, energy - 25); // 扣除大量能量
                        speed = Math.max(2, speed - 8); // 强制减速
                        showToast("💥 撞击红障！能量暴减！");
                        
                        // 产生红火花爆炸粒子
                        for(let p=0; p<15; p++) {
                            particles.push(new SparkParticle(elX, elY, '#ff007f'));
                        }
                    } else if (el.type === 'energy') {
                        // 拾取蓝色充能闪电
                        playCollectSound();
                        energy = Math.min(100, energy + 20); // 恢复电量
                        score += 500;
                        showToast("⚡ 能量充沛！里程加速！");
                        
                        // 产生蓝粒子喷射
                        for(let p=0; p<12; p++) {
                            particles.push(new SparkParticle(elX, elY, '#00f0ff'));
                        }
                    }
                    // 销毁物体
                    roadElements.splice(i, 1);
                }
            }
        }

        // 6. 更新碰撞粒子效果
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            if (particles[i].alpha <= 0) {
                particles.splice(i, 1);
            }
        }

        // 7. 振动递减
        if (screenShake > 0) screenShake -= 0.5;

        // 更新 HUD 元素
        document.getElementById("hud-score-val").innerText = String(score).padStart(6, '0') + " M";
        document.getElementById("hud-speed-val").innerText = `${Math.floor(speed * 15)} KM/H`;
        document.getElementById("hud-energy-fill").style.width = `${energy}%`;
    }

    // ---------- 渲染页面逻辑 ----------
    function draw() {
        ctx.save();
        
        // 镜头抖动效果
        if (screenShake > 0) {
            const dx = (Math.random() - 0.5) * screenShake;
            const dy = (Math.random() - 0.5) * screenShake;
            ctx.translate(dx, dy);
        }

        ctx.clearRect(0, 0, width, height);

        // 1. 绘制暗紫黑太空背景
        const bgGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
        bgGrad.addColorStop(0, '#02000c');
        bgGrad.addColorStop(0.6, '#0f001b');
        bgGrad.addColorStop(1, '#24003d');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, horizonY);

        // 2. 绘制星空
        stars.forEach(star => {
            ctx.fillStyle = star.color;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });

        // 3. 绘制标志性的霓虹夕阳 (Outrun Sun)
        drawRetroSun();

        // 4. 绘制远山视差背景
        drawMountains();

        // 5. 绘制 3D 渐进式公路网格
        draw3DRoad();

        // 6. 绘制障碍物和道具
        drawRoadElements();

        // 7. 绘制粒子
        particles.forEach(p => p.draw(ctx));

        // 8. 绘制玩家酷炫赛车 (赛车置于底部中央，跑道根据 player.x 左右运动模拟视觉移动)
        drawPlayerCar();

        ctx.restore();
    }

    // 绘制 80年代复古渐变割线太阳
    function drawRetroSun() {
        const sunX = width / 2;
        const sunY = horizonY - 15;
        const sunRadius = Math.min(width * 0.18, 120);

        ctx.save();
        // 剪辑渲染只包含地平线以上
        ctx.beginPath();
        ctx.rect(0, 0, width, horizonY);
        ctx.clip();

        // 创建红黄相间霓虹渐变
        const sunGrad = ctx.createLinearGradient(0, sunY - sunRadius, 0, sunY);
        sunGrad.addColorStop(0, '#ff007f'); // 顶部玫瑰粉
        sunGrad.addColorStop(0.5, '#ff5a00');
        sunGrad.addColorStop(1, '#ffdf00'); // 底部金黄

        ctx.shadowBlur = 30;
        ctx.shadowColor = '#ff007f';

        ctx.fillStyle = sunGrad;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0; // 取消发光

        // 绘制夕阳下落的线条分割线
        ctx.fillStyle = '#0f001b'; // 背景主色
        const stripeStart = sunY - sunRadius;
        const totalHeight = sunRadius * 2;
        
        for (let y = sunY - sunRadius; y < sunY + sunRadius; y += 12) {
            // 越靠近下方，水平割线越宽
            const relativeY = (y - stripeStart) / totalHeight;
            const stripeHeight = Math.pow(relativeY, 2) * 8; // 指数函数拉宽线宽
            if (stripeHeight > 1) {
                ctx.fillRect(sunX - sunRadius - 10, y, sunRadius * 2 + 20, stripeHeight);
            }
        }
        ctx.restore();
    }

    // 绘制远山
    function drawMountains() {
        mountains.forEach(layer => {
            ctx.save();
            ctx.fillStyle = layer.color;
            if (layer.strokeColor) {
                ctx.strokeStyle = layer.strokeColor;
                ctx.shadowBlur = 10;
                ctx.shadowColor = layer.strokeColor;
                ctx.lineWidth = 1.5;
            }
            
            ctx.beginPath();
            ctx.moveTo(0, horizonY);
            
            layer.points.forEach((p, idx) => {
                ctx.lineTo(p.x, p.y);
            });

            ctx.lineTo(width, horizonY);
            ctx.closePath();
            ctx.fill();
            if (layer.strokeColor) ctx.stroke();
            ctx.restore();
        });
    }

    // 绘制 3D 透视公路网格
    function draw3DRoad() {
        ctx.save();

        // 1. 绘制暗紫色渐变路面基底
        const roadGrad = ctx.createLinearGradient(0, horizonY, 0, height);
        roadGrad.addColorStop(0, '#100028');
        roadGrad.addColorStop(1, '#060012');
        ctx.fillStyle = roadGrad;

        ctx.beginPath();
        ctx.moveTo(width / 2 - roadWidthAtHorizon / 2, horizonY);
        ctx.lineTo(width / 2 + roadWidthAtHorizon / 2, horizonY);
        ctx.lineTo(width / 2 + roadWidthAtBottom / 2, height);
        ctx.lineTo(width / 2 - roadWidthAtBottom / 2, height);
        ctx.closePath();
        ctx.fill();

        // 2. 绘制透视纵向车道线
        const numLanes = 3;
        ctx.strokeStyle = varColor('--neon-purple');
        ctx.lineWidth = 1.5;
        ctx.shadowBlur = 5;
        ctx.shadowColor = varColor('--neon-purple');

        const stepWBottom = roadWidthAtBottom / numLanes;
        const stepWHorizon = roadWidthAtHorizon / numLanes;

        // 绘制三条车道的左右边缘和分隔线
        for (let i = 0; i <= numLanes; i++) {
            // 车道线在底部的 X 坐标 (根据 player.x 平移以产生移动镜头位移)
            const xBottom = width / 2 - roadWidthAtBottom / 2 + i * stepWBottom - (player.x * roadWidthAtBottom * 0.28);
            const xHorizon = width / 2 - roadWidthAtHorizon / 2 + i * stepWHorizon - (player.x * roadWidthAtHorizon * 0.28);

            ctx.beginPath();
            ctx.moveTo(xHorizon, horizonY);
            ctx.lineTo(xBottom, height);
            ctx.stroke();
        }

        // 3. 绘制动态推进的横向网格线 (基于行驶位移做指数间隔分布)
        ctx.strokeStyle = varColor('--neon-pink');
        ctx.shadowColor = varColor('--neon-pink');
        ctx.shadowBlur = 8;
        ctx.lineWidth = 1;

        const numGridLines = 14;
        const speedOffset = (distanceTraveled * 0.08) % 1; // 0 到 1 的运动循环值

        for (let i = 0; i < numGridLines; i++) {
            // 将线条索引进行平滑推移
            const z = (i - speedOffset) / (numGridLines - 1);
            if (z < 0) continue;

            // 用指数衰减函数模拟 3D 透视近宽远窄的视觉
            const progress = Math.pow(z, 3.5); 
            const gridY = horizonY + (height - horizonY) * progress;

            // 计算网格宽度
            const currentRoadW = roadWidthAtHorizon + (roadWidthAtBottom - roadWidthAtHorizon) * progress;
            const gridLeft = width / 2 - currentRoadW / 2 - (player.x * currentRoadW * 0.28);
            const gridRight = width / 2 + currentRoadW / 2 - (player.x * currentRoadW * 0.28);

            // 线条越远越淡
            ctx.globalAlpha = progress;
            ctx.beginPath();
            ctx.moveTo(gridLeft, gridY);
            ctx.lineTo(gridRight, gridY);
            ctx.stroke();
        }

        ctx.restore();
    }

    // 绘制下落的障碍物和道具
    function drawRoadElements() {
        roadElements.forEach(el => {
            const scale = 1.0 / el.z;
            const progress = Math.pow(1 - el.z / 100, 2.5);
            
            const roadW = roadWidthAtHorizon + (roadWidthAtBottom - roadWidthAtHorizon) * (1 - el.z / 100);
            const laneCenterOffset = el.lane * (roadW * 0.32);
            
            const elX = width / 2 + laneCenterOffset - (player.x * roadW * 0.28); 
            const elY = horizonY + (height - horizonY) * progress;
            const size = 180 * scale; // 根据透视原理按 scale 缩放

            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = el.color;
            ctx.fillStyle = el.color;
            ctx.globalAlpha = Math.min(1, (1 - el.z / 100) * 1.5); // 出现时淡入

            if (el.type === 'obstacle') {
                // 绘制霓虹激光障碍门
                ctx.strokeStyle = el.color;
                ctx.lineWidth = 3 + scale * 2;
                ctx.fillStyle = 'rgba(255, 0, 127, 0.15)';
                ctx.beginPath();
                ctx.rect(elX - size / 2, elY - size, size, size);
                ctx.fill();
                ctx.stroke();
                
                // 绘制内侧警告斜纹 (霓虹朋克风)
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1 + scale * 2;
                ctx.beginPath();
                ctx.moveTo(elX - size / 2, elY - size / 2);
                ctx.lineTo(elX + size / 2, elY - size);
                ctx.moveTo(elX - size / 2, elY);
                ctx.lineTo(elX + size / 2, elY - size / 2);
                ctx.stroke();
            } else if (el.type === 'energy') {
                // 绘制旋转的悬浮立体晶体 (闪电充能道具)
                ctx.translate(elX, elY - size / 2);
                ctx.rotate(el.angle + Date.now() * 0.005);
                ctx.beginPath();
                // 绘制菱形晶体
                ctx.moveTo(0, -size * 0.7);
                ctx.lineTo(size * 0.4, 0);
                ctx.lineTo(0, size * 0.7);
                ctx.lineTo(-size * 0.4, 0);
                ctx.closePath();
                ctx.fill();
                
                // 绘制晶体高亮亮边
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            ctx.restore();
        });
    }

    // 绘制玩家跑车 (画在下方中央，通过车体倾斜和底盘震动增加动感)
    function drawPlayerCar() {
        const carX = width / 2;
        const carY = height - 85;
        
        ctx.save();
        ctx.translate(carX, carY);
        
        // 转向时车身整体倾斜动画
        ctx.rotate(player.steerAngle);

        // 1. 轮胎 (黑色带霓虹彩边)
        ctx.shadowBlur = 10;
        ctx.shadowColor = varColor('--neon-blue');
        
        // 左后轮
        ctx.fillStyle = '#060a12';
        ctx.fillRect(-player.width / 2 - 4, player.height / 3, 10, 16);
        ctx.fillStyle = varColor('--neon-blue');
        ctx.fillRect(-player.width / 2 - 4, player.height / 3 + 2, 2, 12);

        // 右后轮
        ctx.fillStyle = '#060a12';
        ctx.fillRect(player.width / 2 - 6, player.height / 3, 10, 16);
        ctx.fillStyle = varColor('--neon-blue');
        ctx.fillRect(player.width / 2 - 6 + 8, player.height / 3 + 2, 2, 12);

        // 2. 车身底盘 (玫红色发光)
        ctx.shadowColor = varColor('--neon-pink');
        ctx.shadowBlur = 15;
        ctx.fillStyle = varColor('--neon-pink');
        ctx.beginPath();
        ctx.moveTo(-player.width / 2 + 10, 15);
        ctx.lineTo(-player.width / 2, 30);
        ctx.lineTo(player.width / 2, 30);
        ctx.lineTo(player.width / 2 - 10, 15);
        ctx.closePath();
        ctx.fill();

        // 3. 豪华超跑外壳 (科技青蓝色)
        ctx.shadowColor = varColor('--neon-blue');
        ctx.shadowBlur = 20;
        ctx.fillStyle = varColor('--neon-blue');
        
        ctx.beginPath();
        ctx.moveTo(-player.width / 2 + 12, 10); // 左尾角
        ctx.lineTo(-player.width / 3, -12); // 左车门顶
        ctx.lineTo(player.width / 3, -12); // 右车门顶
        ctx.lineTo(player.width / 2 - 12, 10); // 右尾角
        ctx.lineTo(player.width / 2 - 6, 25);
        ctx.lineTo(-player.width / 2 + 6, 25);
        ctx.closePath();
        ctx.fill();

        // 4. 跑车尾窗 (深色发光板)
        ctx.fillStyle = '#040710';
        ctx.beginPath();
        ctx.moveTo(-player.width / 5, -8);
        ctx.lineTo(player.width / 5, -8);
        ctx.lineTo(player.width / 3, 6);
        ctx.lineTo(-player.width / 3, 6);
        ctx.closePath();
        ctx.fill();

        // 5. 炫酷的后尾灯条 (经典红色发光管)
        ctx.strokeStyle = '#ff003c';
        ctx.shadowColor = '#ff003c';
        ctx.shadowBlur = 12;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-player.width / 2 + 8, 12);
        ctx.lineTo(player.width / 2 - 8, 12);
        ctx.stroke();

        // 尾灯中心亮条 (白光)
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-player.width / 3, 12);
        ctx.lineTo(player.width / 3, 12);
        ctx.stroke();

        ctx.restore();
    }

    // 辅助获取 CSS 变量值
    function varColor(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    // ---------- 游戏主循环 ----------
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // ---------- 游戏生命周期控制 ----------
    const startScreen = document.getElementById("start-screen");
    const gameoverScreen = document.getElementById("gameover-screen");

    function startGame() {
        initAudio();
        score = 0;
        energy = 100;
        speed = 5;
        distanceTraveled = 0;
        
        player.x = 0;
        player.targetX = 0;
        
        roadElements = [];
        particles = [];
        
        initStars();
        initMountains();
        
        gameState = "playing";
        
        startScreen.classList.add("hidden");
        gameoverScreen.classList.add("hidden");
        
        // 鸣笛点火
        startEngineSound();
        playCollectSound();
    }

    function triggerGameOver() {
        gameState = "gameover";
        stopEngineSound();
        playCrashSound();
        screenShake = 25;
        
        // 瞬间喷出很多彩花粒子模拟熄火碰撞
        for (let i = 0; i < 35; i++) {
            particles.push(new SparkParticle(width / 2, height - 70, varColor('--neon-pink')));
        }
        
        document.getElementById("final-score").innerText = score + " M";
        
        // 纪录里程
        const isNewRecord = saveScore(score);
        const newRecordLabel = document.getElementById("new-high-score-label");
        if (isNewRecord) {
            newRecordLabel.innerText = "🏆 恭喜打破尘封的行驶里程记录！";
            newRecordLabel.style.display = "block";
        } else {
            newRecordLabel.style.display = "none";
        }

        setTimeout(() => {
            gameoverScreen.classList.remove("hidden");
            loadHighScoreList();
        }, 1000);
    }

    // ---------- 历史排行榜系统 ----------
    const HIGH_SCORES_KEY = "neon_rider_high_scores_v1";

    function getHighScores() {
        try {
            const list = localStorage.getItem(HIGH_SCORES_KEY);
            return list ? JSON.parse(list) : [];
        } catch(e) {
            return [];
        }
    }

    function saveScore(scoreVal) {
        if (scoreVal <= 0) return false;
        let list = getHighScores();
        const minVal = list.length >= 5 ? list[list.length - 1] : 0;
        
        let newRecord = false;
        if (list.length === 0 || scoreVal > list[0]) {
            newRecord = true;
        }

        list.push(scoreVal);
        list.sort((a, b) => b - a);
        list = list.slice(0, 5); // 留存前五名记录
        
        localStorage.setItem(HIGH_SCORES_KEY, JSON.stringify(list));
        return newRecord;
    }

    function loadHighScoreList() {
        const list = getHighScores();
        const container = document.getElementById("high-scores-container");
        if (list.length === 0) {
            container.innerHTML = `<div style="text-align: center; color: var(--text-muted, #a7b3d8); font-size: 13px; padding: 10px;">暂无行车纪录，油门已备好！</div>`;
            return;
        }
        
        let html = "";
        list.forEach((scoreVal, index) => {
            const medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : "🏁";
            html += `
                <div class="score-item">
                    <span><span class="rank">${medal} 第 ${index + 1} 名</span></span>
                    <span class="val">${scoreVal} M</span>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // ---------- Toast 提示浮窗 ----------
    function showToast(msg) {
        const toast = document.createElement("div");
        toast.style.position = "absolute";
        toast.style.top = "90px";
        toast.style.left = "50%";
        toast.style.transform = "translateX(-50%)";
        toast.style.background = "var(--panel-bg)";
        toast.style.border = "1px solid var(--neon-pink)";
        toast.style.color = "var(--neon-pink)";
        toast.style.padding = "8px 16px";
        toast.style.borderRadius = "8px";
        toast.style.fontSize = "14px";
        toast.style.fontWeight = "bold";
        toast.style.textShadow = "0 0 5px rgba(255, 0, 127, 0.4)";
        toast.style.boxShadow = "0 0 10px rgba(255, 0, 127, 0.2)";
        toast.style.animation = "toastAnim 1.2s forwards";
        toast.style.pointerEvents = "none";
        toast.style.zIndex = "1000";
        toast.innerText = msg;
        
        document.getElementById("game-container").appendChild(toast);
        
        setTimeout(() => {
            toast.remove();
        }, 1200);
    }

    // 注入 Toast CSS 样式
    const styleSheet = document.createElement("style");
    styleSheet.innerText = `
        @keyframes toastAnim {
            0% { opacity: 0; transform: translate(-50%, 20px); }
            15% { opacity: 1; transform: translate(-50%, 0); }
            85% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }
    `;
    document.head.appendChild(styleSheet);

    // ---------- 按钮点击逻辑 ----------
    document.getElementById("start-btn").addEventListener("click", startGame);
    document.getElementById("restart-btn").addEventListener("click", startGame);
    document.getElementById("back-to-menu-btn").addEventListener("click", () => {
        gameState = "start";
        startScreen.classList.remove("hidden");
        gameoverScreen.classList.add("hidden");
        loadHighScoreList();
    });

    // 渲染初始化
    initStars();
    initMountains();
    loadHighScoreList();
    gameLoop();
</script>
