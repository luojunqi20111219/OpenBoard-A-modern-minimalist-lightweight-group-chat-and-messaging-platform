<!DOCTYPE html>
<!--
  原版是 Jinja2 服务端渲染模板（依赖 FastAPI 注入 messages / users / groups）。
  Cloudflare Pages 只能托管静态文件，因此改为纯静态 + fetch /api/admin/overview 渲染。
-->
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>ROOT 管理后台 - 信语 (OpenBoard)</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        body { background: #f0f2f5; display: flex; height: 100vh; font-family: sans-serif; margin:0; overflow: hidden; }
        .sidebar { width: 220px; background: white; border-right: 1px solid #ddd; padding: 20px; display: flex; flex-direction: column; }
        .sidebar h2 { color: #f44336; font-size: 18px; margin-bottom: 30px; }
        .nav-item { padding: 12px; margin-bottom: 5px; border-radius: 8px; cursor: pointer; color: #555; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: #e3f2fd; color: #1976D2; font-weight: bold; }
        .main { flex: 1; padding: 30px; overflow-y: auto; }

        .page { display: none; }
        .page.active { display: block; }

        .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #eee; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 12px; background: #fafafa; border-bottom: 2px solid #eee; color: #666; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; }

        .btn-batch { background: #ff4757; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; font-weight: bold; }
        .btn-batch:hover { background: #ff6b81; }
        .btn-action { border: 1px solid #ddd; background: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: 0.3s; margin-right: 5px; }
        .btn-action:hover { background: #eee; }
        .btn-delete { color: #f44336; border: 1px solid #ffcdd2; background: #ffebee; }
        .btn-delete:hover { background: #f44336; color: white; }
        .loading { padding: 30px; color: #999; }
    </style>
</head>
<body>
    <input type="file" id="admin-avatar-upload" accept="image/*" style="display: none;">

    <div class="sidebar">
        <h2>🛡️ 信语 ROOT 系统</h2>
        <div style="font-size: 12px; color: #999; margin-top: -25px; margin-bottom: 20px;">
            当前版本: <span id="current-ver-label">v8.0.0</span>
            <div id="runtime-label" style="margin-top: 5px;">Cloudflare Workers</div>
        </div>

        <div class="nav-item active" onclick="showPage('msgPage', this)">💬 留言管理</div>
        <div id="nav-group" class="nav-item" onclick="showPage('groupPage', this)">🗂️ 群聊管理</div>
        <div id="nav-user" class="nav-item" onclick="showPage('userPage', this)">👥 用户管理</div>
        <div id="nav-notice" class="nav-item" onclick="showPage('noticePage', this)">📢 系统公告</div>
        <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
        <a href="/" style="text-decoration:none; color:#666; padding:12px; display:block;">🏠 返回首页</a>
    </div>

    <div class="main">
        <div id="msgPage" class="page active">
            <div class="card">
                <h3>💬 留言管理 (<span id="msg-count">0</span> 条)</h3>
                <button class="btn-batch" onclick="batchDeleteMessages()">🗑️ 批量删除选中项</button>
                <table>
                    <thead>
                        <tr><th><input type="checkbox" id="selectAllMsgs" onclick="toggleAllMsgs(this)"></th><th>位置</th><th>作者</th><th>内容预览</th><th>时间</th><th>操作</th></tr>
                    </thead>
                    <tbody id="msg-body"><tr><td colspan="6" class="loading">加载中…</td></tr></tbody>
                </table>
            </div>
        </div>

        <div id="groupPage" class="page">
            <div class="card">
                <h3>🗂️ 群聊频道管理 (<span id="group-count">0</span> 个)</h3>
                <button class="btn-batch" onclick="batchDeleteGroups()">🗑️ 批量解散选中群聊</button>
                <table>
                    <thead>
                        <tr><th><input type="checkbox" id="selectAllGroups" onclick="toggleAllGroups(this)"></th><th>ID</th><th>群名称</th><th>群主ID</th><th>状态</th><th>操作</th></tr>
                    </thead>
                    <tbody id="group-body"><tr><td colspan="6" class="loading">加载中…</td></tr></tbody>
                </table>
            </div>
        </div>

        <div id="userPage" class="page">
            <div class="card">
                <h3>👥 用户权限管理 (<span id="user-count">0</span> 名，在线 <span id="online-count">0</span>)</h3>
                <table>
                    <thead>
                        <tr><th>ID</th><th>账号名</th><th>昵称</th><th>状态</th><th>管理员操作</th></tr>
                    </thead>
                    <tbody id="user-body"><tr><td colspan="5" class="loading">加载中…</td></tr></tbody>
                </table>
            </div>
        </div>

        <div id="noticePage" class="page">
            <div class="card">
                <h3>📢 发布系统全局公告</h3>
                <p style="color:#666; font-size:14px;">发出的公告将通过 WebSocket 实时推送给所有在线用户。</p>
                <textarea id="broadcast-content" style="width: 100%; height: 100px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; font-family: inherit;" placeholder="请输入公告内容..."></textarea>
                <button class="btn-batch" style="background:#1976D2; margin-bottom:0;" onclick="sendBroadcast()">🚀 立即发布全局公告</button>
            </div>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('user') || 'null');
        if (!currentUser || currentUser.role !== 1) {
            alert("🛑 访问被拒绝：您没有管理员权限！");
            window.location.href = "/";
        }

        const authHeaders = { 'Content-Type': 'application/json', 'Authorization': currentUser ? currentUser.token : '' };
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        function showPage(pageId, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            element.classList.add('active');
        }

        // --- 数据加载 ---------------------------------------------------------
        async function loadOverview() {
            try {
                const res = await fetch('/api/admin/overview', { headers: authHeaders });
                if (!res.ok) throw new Error(await res.text());
                const d = await res.json();
                renderMessages(d.messages || []);
                renderGroups(d.groups || []);
                renderUsers(d.users || []);
                document.getElementById('online-count').textContent = (d.online || []).length;
            } catch (e) {
                document.getElementById('msg-body').innerHTML = '<tr><td colspan="6" style="color:red">加载失败：' + esc(e.message) + '</td></tr>';
            }
        }

        function renderMessages(rows) {
            document.getElementById('msg-count').textContent = rows.length;
            document.getElementById('msg-body').innerHTML = rows.map(m => {
                const pos = m.room_id == 0 ? '<span style="color:gray;">公共大厅</span>'
                          : m.room_id == -1 ? '<span style="color:purple;">💌 私聊</span>'
                          : '群: ' + m.room_id;
                return `<tr>
                    <td><input type="checkbox" class="msg-check" value="${m.id}" onclick="updateSelectAllMsgs()"></td>
                    <td>${pos}</td>
                    <td style="font-weight:bold; color:#1976D2;">${esc(m.name)}</td>
                    <td title="${esc(m.content)}">${esc(String(m.content || '').slice(0, 40))}</td>
                    <td style="color:#999; font-size:12px;">${esc(m.created_at)}</td>
                    <td><button class="btn-action btn-delete" onclick="deleteMsg('${m.id}')">删除</button></td>
                </tr>`;
            }).join('') || '<tr><td colspan="6">暂无数据</td></tr>';
        }

        function renderGroups(rows) {
            document.getElementById('group-count').textContent = rows.length;
            document.getElementById('group-body').innerHTML = rows.map(g => {
                const frozen = g.is_frozen ? '<span style="color:red; font-weight:bold;">● 已冻结</span>'
                                           : '<span style="color:green;">● 正常</span>';
                const ops = g.id == 0 ? '' : `
                    <button class="btn-action" onclick="toggleFreezeGroup('${g.id}')">${g.is_frozen ? '解冻' : '冻结'}</button>
                    <button class="btn-action" onclick="triggerAdminAvatarUpload('group', '${g.id}')">改头像</button>
                    <button class="btn-action btn-delete" onclick="adminDeleteGroup('${g.id}')">解散</button>`;
                return `<tr>
                    <td>${g.id != 0 ? `<input type="checkbox" class="group-check" value="${g.id}" onclick="updateSelectAllGroups()">` : ''}</td>
                    <td>${g.id}</td>
                    <td style="font-weight:bold; color:#1976D2;">${esc(g.name)}</td>
                    <td>${g.owner_id == 0 ? '系统内置' : g.owner_id}</td>
                    <td>${frozen}</td>
                    <td>${ops}</td>
                </tr>`;
            }).join('') || '<tr><td colspan="6">暂无数据</td></tr>';
        }

        function renderUsers(rows) {
            document.getElementById('user-count').textContent = rows.length;
            document.getElementById('user-body').innerHTML = rows.map(u => {
                const state = u.is_banned ? '<span style="color:red;">● 封禁</span>' : '<span style="color:green;">● 正常</span>';
                const protected_ = ['admin', '官方账号'].includes(u.username);
                const ops = protected_
                    ? '<span style="color:#aaa; font-size:12px; margin-left:10px;">系统保护</span>'
                    : `<button class="btn-action" onclick="adminResetPwd('${u.id}', '${esc(u.username)}')">改密码</button>
                       <button class="btn-action btn-delete" onclick="adminDeleteUser('${u.id}', '${esc(u.username)}')">彻底删除</button>`;
                return `<tr>
                    <td>${u.id}</td>
                    <td style="font-weight:bold;">${esc(u.username)}${u.role == 1 ? ' <span style="color:#f44336;font-size:12px">管理员</span>' : ''}</td>
                    <td>${esc(u.nickname || '-')}</td>
                    <td>${state}</td>
                    <td>
                        <button class="btn-action" onclick="toggleBan('${u.id}')">${u.is_banned ? '解除' : '封禁'}</button>
                        <button class="btn-action" onclick="triggerAdminAvatarUpload('user', '${u.id}')">改头像</button>
                        ${ops}
                    </td>
                </tr>`;
            }).join('') || '<tr><td colspan="5">暂无数据</td></tr>';
        }

        // --- 操作 -------------------------------------------------------------
        async function post(url, payload) {
            const res = await fetch(url, { method: 'POST', headers: authHeaders, body: JSON.stringify(payload) });
            return res.json();
        }

        function toggleFreezeGroup(gid) {
            if (!confirm("确认要改变此群聊的冻结状态吗？")) return;
            post('/api/admin/toggle_freeze_group', { group_id: parseInt(gid) })
                .then(d => { alert(d.msg || d.detail); loadOverview(); });
        }

        let pendingUploadType = ''; let pendingUploadId = 0;
        function triggerAdminAvatarUpload(type, id) {
            pendingUploadType = type; pendingUploadId = parseInt(id);
            document.getElementById('admin-avatar-upload').click();
        }

        document.getElementById('admin-avatar-upload').addEventListener('change', function(e) {
            if (!e.target.files || !e.target.files[0]) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                    const maxSize = 150; const size = Math.min(img.width, img.height);
                    canvas.width = maxSize; canvas.height = maxSize;
                    ctx.drawImage(img, (img.width - size)/2, (img.height - size)/2, size, size, 0, 0, maxSize, maxSize);
                    const base64 = canvas.toDataURL('image/jpeg', 0.8);

                    const endpoint = pendingUploadType === 'user' ? '/api/admin/update_user_avatar' : '/api/admin/update_group_avatar';
                    const payload = pendingUploadType === 'user'
                        ? { user_id: pendingUploadId, avatar_base64: base64 }
                        : { group_id: pendingUploadId, avatar_base64: base64 };

                    post(endpoint, payload).then(d => { alert(d.msg || d.detail); loadOverview(); });
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
            e.target.value = '';
        });

        function toggleBan(uid) {
            post('/api/toggle_ban_user', { user_id: parseInt(uid) })
                .then(d => { alert(d.msg || d.detail); loadOverview(); });
        }
        function adminResetPwd(uid, uname) {
            const newPwd = prompt(`请输入为用户 [${uname}] 设置的新密码：`);
            if (!newPwd) return;
            post('/api/admin/reset-password', { user_id: parseInt(uid), new_password: newPwd })
                .then(d => { alert(d.msg || d.detail || "密码重置成功"); });
        }
        function adminDeleteUser(uid, uname) {
            if (confirm(`🚨 极端操作警告：\n你正在删除用户 [${uname}]！\n确认执行吗？`)) {
                post('/api/admin/delete_user', { user_id: parseInt(uid) })
                    .then(d => { alert(d.msg || "已删除"); loadOverview(); });
            }
        }

        function deleteMsg(mid) {
            post('/api/delete_messages', { msg_ids: [parseInt(mid)] }).then(() => loadOverview());
        }
        function batchDeleteMessages() {
            const ids = Array.from(document.querySelectorAll('.msg-check:checked')).map(cb => parseInt(cb.value));
            if (ids.length) post('/api/delete_messages', { msg_ids: ids }).then(() => loadOverview());
        }
        function toggleAllMsgs(source) { document.querySelectorAll('.msg-check').forEach(cb => cb.checked = source.checked); }
        function updateSelectAllMsgs() { document.getElementById('selectAllMsgs').checked = Array.from(document.querySelectorAll('.msg-check')).every(cb => cb.checked); }

        function adminDeleteGroup(gid) {
            post('/api/admin/delete_group', { group_id: parseInt(gid) }).then(() => loadOverview());
        }
        function batchDeleteGroups() {
            const ids = Array.from(document.querySelectorAll('.group-check:checked')).map(cb => parseInt(cb.value));
            if (ids.length) post('/api/admin/delete_groups', { group_ids: ids }).then(() => loadOverview());
        }
        function toggleAllGroups(source) { document.querySelectorAll('.group-check').forEach(cb => cb.checked = source.checked); }
        function updateSelectAllGroups() { document.getElementById('selectAllGroups').checked = Array.from(document.querySelectorAll('.group-check')).every(cb => cb.checked); }

        function sendBroadcast() {
            const content = document.getElementById('broadcast-content').value.trim();
            if (!content) return alert("请输入内容");
            post('/api/admin/broadcast', { content }).then(d => {
                if (d.status === 'success') { alert("✅ 公告已成功发布！"); document.getElementById('broadcast-content').value = ''; }
                else alert("❌ 发布失败：" + (d.detail || '未知错误'));
            });
        }

        window.onload = function() {
            loadOverview();
            fetch('/api/check_update').then(r => r.json()).then(d => {
                if (d.version) document.getElementById('current-ver-label').textContent = d.version;
            }).catch(() => {});
        };
    </script>
</body>
</html>
