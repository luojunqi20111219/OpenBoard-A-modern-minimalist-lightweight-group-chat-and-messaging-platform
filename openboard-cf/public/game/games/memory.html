<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>记忆翻牌 · 游戏中心</title>
<style>
:root{--bg1:#1a1a2e;--bg2:#16213e;--bg3:#0f3460;--glass:rgba(255,255,255,.08);--glass-b:rgba(255,255,255,.16);--ink:#eef6ff;--ink-dim:#9db4c8;--accent:#b388ff;--good:#69f0ae}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));background-attachment:fixed;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px 14px}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.3;z-index:0;pointer-events:none}
.orb.a{width:320px;height:320px;background:#b388ff;top:-80px;right:-80px}
.orb.b{width:380px;height:380px;background:#7c4dff;bottom:-120px;left:-100px}
.topbar{position:relative;z-index:1;width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.back{background:var(--glass);border:1px solid var(--glass-b);color:var(--ink);width:42px;height:42px;border-radius:12px;font-size:20px;cursor:pointer;backdrop-filter:blur(8px)}
.title{font-size:26px;font-weight:800;background:linear-gradient(90deg,#b388ff,#7c4dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hud{position:relative;z-index:1;display:flex;gap:12px;margin-bottom:16px}
.hud .box{background:var(--glass);border:1px solid var(--glass-b);border-radius:12px;padding:8px 18px;text-align:center;backdrop-filter:blur(8px)}
.hud .l{font-size:11px;color:var(--ink-dim);letter-spacing:1px}
.hud .v{font-size:20px;font-weight:800}
.diffs{position:relative;z-index:1;display:flex;gap:8px;margin-bottom:18px}
.diff{background:var(--glass);border:1px solid var(--glass-b);color:var(--ink);border-radius:10px;padding:8px 16px;font-size:13px;cursor:pointer;backdrop-filter:blur(8px);transition:.15s}
.diff.on{background:rgba(179,136,255,.3);border-color:var(--accent);color:var(--accent)}
.grid{position:relative;z-index:1;display:grid;gap:10px;perspective:800px}
.card{aspect-ratio:1;cursor:pointer;transform-style:preserve-3d;transition:transform .4s}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:clamp(24px,8vw,42px)}
.front{background:linear-gradient(145deg,rgba(179,136,255,.3),rgba(124,77,255,.15));border:1px solid rgba(179,136,255,.4)}
.front span{font-size:clamp(20px,6vw,32px);opacity:.5}
.back{background:var(--glass);border:1px solid var(--glass-b);transform:rotateY(180deg)}
.back.matched{background:rgba(105,240,174,.25);border-color:var(--good)}
.btns{position:relative;z-index:1;display:flex;gap:10px;margin-top:18px}
.btn{flex:1;background:var(--glass);border:1px solid var(--glass-b);color:var(--ink);border-radius:12px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;backdrop-filter:blur(8px)}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(90deg,#b388ff,#7c4dff);border:none}
.mask{position:fixed;inset:0;background:rgba(5,12,20,.75);backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.mask.show{display:flex}
.dlg{background:linear-gradient(160deg,#1c3048,#141f30);border:1px solid var(--glass-b);border-radius:22px;padding:28px 24px;width:100%;max-width:320px;text-align:center;animation:pop .3s}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.dlg h2{font-size:22px;margin-bottom:8px}
.dlg p{color:var(--ink-dim);font-size:14px;margin-bottom:16px}
.dlg .btn{width:100%;margin-top:8px}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div>
<div class="topbar">
  <button class="back" onclick="history.back()">‹</button>
  <div class="title">🃏 记忆翻牌</div>
  <div style="width:42px"></div>
</div>
<div class="hud">
  <div class="box"><div class="l">步数</div><div class="v" id="moves">0</div></div>
  <div class="box"><div class="l">配对</div><div class="v" id="pairs">0/0</div></div>
  <div class="box"><div class="l">时间</div><div class="v" id="timer">00:00</div></div>
</div>
<div class="diffs">
  <button class="diff on" data-d="easy">简单 4×3</button>
  <button class="diff" data-d="med">中等 4×4</button>
  <button class="diff" data-d="hard">困难 6×4</button>
</div>
<div class="grid" id="grid"></div>
<div class="btns">
  <button class="btn pri" onclick="newGame()">🔄 新游戏</button>
</div>
<div class="mask" id="win"><div class="dlg">
  <h2>🎉 全部配对！</h2>
  <p id="winText"></p>
  <button class="btn pri" onclick="newGame()">再来一局</button>
  <button class="btn" onclick="history.back()">返回游戏中心</button>
</div></div>
<script>
'use strict';
const EMOJIS=['🍎','🍌','🍇','🍒','🍓','🍑','🥝','🍍','🥥','🍉','🍋','🍊','🍐','🥑','🍆','🌽','🥕','🌶️','🥦','🍄','🧀','🍞','🍗','🍩'];
const CONF={easy:{c:4,r:3},med:{c:4,r:4},hard:{c:6,r:4}};
let cur='easy',cards,flipped,matched,moves,timer,tid,started;
function newGame(){
  const{c,r}=CONF[cur];const total=c*r/2;
  const pool=EMOJIS.slice(0,total);
  cards=shuffle([...pool,...pool]);
  flipped=[];matched=new Set();moves=0;started=false;
  clearInterval(tid);timer=0;document.getElementById('timer').textContent='00:00';
  document.getElementById('moves').textContent='0';
  document.getElementById('pairs').textContent='0/'+total;
  document.getElementById('win').classList.remove('show');
  const g=document.getElementById('grid');
  g.style.gridTemplateColumns=`repeat(${c},1fr)`;
  g.style.width=`min(90vw,${c*90}px)`;
  g.innerHTML='';
  cards.forEach((e,i)=>{
    const card=document.createElement('div');card.className='card';card.dataset.i=i;
    card.innerHTML=`<div class="face front"><span>❓</span></div><div class="face back">${e}</div>`;
    card.addEventListener('click',()=>flip(i));
    g.appendChild(card);
  });
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function startTimer(){tid=setInterval(()=>{timer++;const m=String(timer/60|0).padStart(2,'0'),s=String(timer%60).padStart(2,'0');document.getElementById('timer').textContent=m+':'+s},1000)}
function flip(i){
  if(flipped.includes(i)||matched.has(i))return;
  if(flipped.length>=2)return;
  if(!started){started=true;startTimer()}
  const card=document.getElementById('grid').children[i];
  card.classList.add('flip');flipped.push(i);
  if(flipped.length===2){
    moves++;document.getElementById('moves').textContent=moves;
    const[a,b]=flipped;
    if(cards[a]===cards[b]){
      matched.add(a);matched.add(b);
      setTimeout(()=>{document.getElementById('grid').children[a].querySelector('.back').classList.add('matched');document.getElementById('grid').children[b].querySelector('.back').classList.add('matched')},300);
      flipped=[];
      const total=cards.length/2;
      document.getElementById('pairs').textContent=matched.size/2+'/'+total;
      if(matched.size/2===total){clearInterval(tid);saveStats();setTimeout(()=>{const m=String(timer/60|0).padStart(2,'0'),s=String(timer%60).padStart(2,'0');document.getElementById('winText').textContent=`用时 ${m}:${s} · ${moves} 步完成`;document.getElementById('win').classList.add('show')},500)}
    }else{
      setTimeout(()=>{document.getElementById('grid').children[a].classList.remove('flip');document.getElementById('grid').children[b].classList.remove('flip');flipped=[]},700)
    }
  }
}
function saveStats(){try{const d=JSON.parse(localStorage.getItem('gamehub_stats')||'{}');d.played=(d.played||0)+1;d.stars=(d.stars||0)+100;localStorage.setItem('gamehub_stats',JSON.stringify(d))}catch(e){}}
document.querySelectorAll('.diff').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.diff').forEach(x=>x.classList.remove('on'));b.classList.add('on');cur=b.dataset.d;newGame()}));
newGame();
</script>
</body>
</html>
