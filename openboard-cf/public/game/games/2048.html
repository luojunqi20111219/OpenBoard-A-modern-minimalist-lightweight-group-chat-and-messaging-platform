<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 · 游戏中心</title>
<style>
:root{--bg1:#0f2027;--bg2:#203a43;--bg3:#2c5364;--glass:rgba(255,255,255,.08);--glass-b:rgba(255,255,255,.16);--ink:#eef6ff;--ink-dim:#9db4c8;--board:#1a2a3a;--cell:rgba(255,255,255,.06)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));background-attachment:fixed;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px 14px}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.3;z-index:0;pointer-events:none}
.orb.a{width:320px;height:320px;background:#ffd54f;top:-80px;left:-80px}
.orb.b{width:380px;height:380px;background:#ff8a65;bottom:-120px;right:-100px}
.topbar{position:relative;z-index:1;width:100%;max-width:440px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.back{background:var(--glass);border:1px solid var(--glass-b);color:var(--ink);width:42px;height:42px;border-radius:12px;font-size:20px;cursor:pointer;backdrop-filter:blur(8px)}
.title{font-size:32px;font-weight:800;background:linear-gradient(90deg,#ffd54f,#ff8a65);-webkit-background-clip:text;background-clip:text;color:transparent}
.scores{position:relative;z-index:1;display:flex;gap:10px;margin-bottom:16px}
.score{background:var(--glass);border:1px solid var(--glass-b);border-radius:12px;padding:10px 20px;text-align:center;backdrop-filter:blur(8px);min-width:90px}
.score .l{font-size:11px;color:var(--ink-dim);letter-spacing:1px}
.score .v{font-size:24px;font-weight:800}
.board-wrap{position:relative;z-index:1;background:var(--glass);border:1px solid var(--glass-b);border-radius:18px;padding:12px;backdrop-filter:blur(10px);box-shadow:0 16px 40px rgba(0,0,0,.35)}
.board{position:relative;background:var(--board);border-radius:12px;width:min(90vw,400px);aspect-ratio:1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px}
.tile{border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,7vw,38px);font-weight:800;background:var(--cell);transition:all .12s;color:#fff}
.t2{background:#264653;color:#aac7d8}.t4{background:#2a9d8f;color:#fff}
.t8{background:#e9c46a}.t16{background:#f4a261}.t32{background:#e76f51}
.t64{background:#e63946}.t128{background:#a663cc;font-size:clamp(18px,6vw,32px)}
.t256{background:#4361ee;font-size:clamp(18px,6vw,32px)}.t512{background:#4cc9f0;font-size:clamp(18px,6vw,32px)}
.t1024{background:#06d6a0;font-size:clamp(15px,5vw,28px)}.t2048{background:#ffd700;font-size:clamp(15px,5vw,28px);box-shadow:0 0 20px rgba(255,215,0,.6)}
.t-big{background:#b388ff;font-size:clamp(13px,4.5vw,24px)}
.btns{position:relative;z-index:1;display:flex;gap:10px;margin-top:16px}
.btn{flex:1;background:var(--glass);border:1px solid var(--glass-b);color:var(--ink);border-radius:12px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;backdrop-filter:blur(8px);transition:.15s}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(90deg,#ffd54f,#ff8a65);color:#1a1a1a;border:none}
.tip{position:relative;z-index:1;color:var(--ink-dim);font-size:12px;margin-top:14px;text-align:center;letter-spacing:1px}
.mask{position:fixed;inset:0;background:rgba(5,12,20,.75);backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.mask.show{display:flex}
.dlg{background:linear-gradient(160deg,#1c3048,#141f30);border:1px solid var(--glass-b);border-radius:22px;padding:28px 24px;width:100%;max-width:320px;text-align:center;animation:pop .3s}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.dlg h2{font-size:22px;margin-bottom:8px}
.dlg p{color:var(--ink-dim);font-size:14px;margin-bottom:16px}
.dlg .btn{width:100%;margin-top:8px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(80px);background:rgba(20,34,50,.95);border:1px solid var(--glass-b);color:var(--ink);padding:10px 22px;border-radius:30px;font-size:14px;z-index:70;transition:transform .3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div>
<div class="topbar">
  <button class="back" onclick="history.back()">‹</button>
  <div class="title">2048</div>
  <div style="width:42px"></div>
</div>
<div class="scores">
  <div class="score"><div class="l">当前分数</div><div class="v" id="score">0</div></div>
  <div class="score"><div class="l">最高分</div><div class="v" id="best">0</div></div>
</div>
<div class="board-wrap"><div class="board" id="board"></div></div>
<div class="btns">
  <button class="btn pri" onclick="newGame()">🔄 新游戏</button>
  <button class="btn" onclick="undo()">↩️ 撤销</button>
</div>
<div class="tip">滑动屏幕或方向键移动 · 相同数字合并</div>
<div class="mask" id="over"><div class="dlg">
  <h2 id="overTitle">🎉 游戏结束</h2>
  <p id="overText"></p>
  <button class="btn pri" onclick="newGame()">再来一局</button>
  <button class="btn" onclick="history.back()">返回游戏中心</button>
</div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
let grid,score,best,prevGrid,prevScore,won,moved;
best=+localStorage.getItem('g2048_best')||0;
function init(){grid=Array(4).fill().map(()=>Array(4).fill(0));score=0;won=false;prevGrid=null;prevScore=0;addTile();addTile();render()}
function addTile(){const e=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!grid[r][c])e.push([r,c]);if(!e.length)return;const[r,c]=e[Math.random()*e.length|0];grid[r][c]=Math.random()<.9?2:4}
function render(){
  const b=document.getElementById('board');b.innerHTML='';
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    const v=grid[r][c];const d=document.createElement('div');
    d.className='tile'+(v?' t'+(v>2048?'big':v):'');
    d.textContent=v||'';b.appendChild(d);
  }
  document.getElementById('score').textContent=score;
  document.getElementById('best').textContent=best;
}
function saveStats(){try{const d=JSON.parse(localStorage.getItem('gamehub_stats')||'{}');d.played=(d.played||0)+1;d.stars=(d.stars||0)+Math.min(score,2048);localStorage.setItem('gamehub_stats',JSON.stringify(d))}catch(e){}}
function slide(row){const a=row.filter(x=>x);for(let i=0;i<a.length-1;i++){if(a[i]===a[i+1]){a[i]*=2;score+=a[i];if(a[i]===2048&&!won){won=true;setTimeout(()=>showOver('🎉 恭喜通关！','你达到了 2048！继续挑战更高分数吧',true),300)}a.splice(i+1,1)}}while(a.length<4)a.push(0);return a}
function move(dir){
  if(document.getElementById('over').classList.contains('show'))return;
  prevGrid=grid.map(r=>[...r]);prevScore=score;moved=false;
  const g=grid.map(r=>[...r]);
  if(dir==='l'){for(let r=0;r<4;r++){const n=slide(g[r]);if(JSON.stringify(n)!==JSON.stringify(g[r]))moved=true;g[r]=n}}
  else if(dir==='r'){for(let r=0;r<4;r++){const n=slide(g[r].reverse()).reverse();if(JSON.stringify(n)!==JSON.stringify(g[r]))moved=true;g[r]=n}}
  else if(dir==='u'){for(let c=0;c<4;c++){const col=[g[0][c],g[1][c],g[2][c],g[3][c]];const n=slide(col);for(let r=0;r<4;r++)if(g[r][c]!==n[r])moved=true;for(let r=0;r<4;r++)g[r][c]=n[r]}}
  else if(dir==='d'){for(let c=0;c<4;c++){const col=[g[3][c],g[2][c],g[1][c],g[0][c]];const n=slide(col);for(let r=0;r<4;r++)if(g[3-r][c]!==n[r])moved=true;for(let r=0;r<4;r++)g[3-r][c]=n[r]}}
  if(!moved)return;
  grid=g;addTile();render();
  if(score>best){best=score;localStorage.setItem('g2048_best',best)}
  if(!canMove()){saveStats();setTimeout(()=>showOver('💔 游戏结束','最终分数：'+score,false),400)}
}
function canMove(){for(let r=0;r<4;r++)for(let c=0;c<4;c++){if(!grid[r][c])return true;if(c<3&&grid[r][c]===grid[r][c+1])return true;if(r<3&&grid[r][c]===grid[r+1][c])return true}return false}
function undo(){if(!prevGrid){toast('没有可撤销的操作');return}grid=prevGrid;score=prevScore;prevGrid=null;render()}
function newGame(){document.getElementById('over').classList.remove('show');init()}
function showOver(t,sub,win){document.getElementById('overTitle').textContent=t;document.getElementById('overText').textContent=sub;document.getElementById('over').classList.add('show')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1500)}
document.addEventListener('keydown',e=>{const m={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',a:'l',d:'r',w:'u',s:'d'};if(m[e.key]){e.preventDefault();move(m[e.key])}});
let tx,ty;
document.getElementById('board').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.getElementById('board').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)<20&&Math.abs(dy)<20)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?'r':'l');else move(dy>0?'d':'u')},{passive:true});
init();
</script>
</body>
</html>
