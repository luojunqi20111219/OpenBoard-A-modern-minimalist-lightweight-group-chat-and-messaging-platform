<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>霓虹战机：极速星海 (Neon Strike)</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --neon-blue: #00f0ff;
            --neon-pink: #ff007f;
            --neon-purple: #a855f7;
            --bg-dark: #060913;
            --panel-bg: rgba(10, 15, 30, 0.7);
            --border-glow: rgba(0, 240, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            background-color: #020308;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.1);
        }

        /* HUD Overlay */
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-family: 'Orbitron', sans-serif;
            z-index: 10;
        }

        .hud-item {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            padding: 10px 20px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
        }

        .hud-score {
            color: var(--neon-blue);
            font-weight: 700;
            font-size: 20px;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }

        .hud-hp {
            color: var(--neon-pink);
            font-weight: 700;
            font-size: 20px;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.5);
        }

        .hud-hp-bar {
            width: 120px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid rgba(255, 0, 127, 0.3);
        }

        .hud-hp-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
            transition: width 0.2s;
            box-shadow: 0 0 8px var(--neon-pink);
        }

        /* Screens Overlay */
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 6, 15, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s;
        }

        .hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        .menu-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
            animation: panelFadeIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes panelFadeIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--neon-blue) 0%, var(--neon-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.4));
        }

        .subtitle {
            font-size: 16px;
            color: var(--text-muted, #9ca3af);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 35px;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #0085f0, #0078d7);
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 120, 215, 0.3);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 240, 255, 0.5);
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border-color: #fff;
        }

        .btn-settings {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-muted, #9ca3af);
            box-shadow: none;
        }

        .btn-settings:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
            transform: none;
            box-shadow: none;
        }

        /* High Score Board */
        .score-list {
            margin: 20px 0;
            padding: 0;
            list-style: none;
            text-align: left;
        }

        .score-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 15px;
        }

        .score-item:last-child {
            border-bottom: none;
        }

        .score-item .rank {
            color: var(--neon-blue);
            font-weight: bold;
            margin-right: 10px;
        }

        .score-item .val {
            color: var(--neon-pink);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
        }

        /* Controls Tip */
        .controls-tip {
            font-size: 13px;
            color: var(--text-muted, #6b7280);
            margin-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
            display: flex;
            justify-content: space-around;
        }

        .controls-tip i {
            margin-right: 4px;
            color: var(--neon-blue);
        }

        /* Volume Controls */
        .volume-control {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 1000;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .volume-control:hover {
            box-shadow: 0 0 10px var(--neon-blue);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Game HUD -->
    <div class="hud">
        <div class="hud-item">
            <i class="fa-solid fa-gamepad" style="color: var(--neon-blue);"></i>
            <span class="hud-score" id="hud-score-val">000000</span>
        </div>
        <div class="hud-item">
            <span class="hud-hp" id="hud-level-val">LV. 1</span>
        </div>
        <div class="hud-item">
            <div class="hud-hp-bar">
                <div class="hud-hp-fill" id="hud-hp-fill"></div>
            </div>
            <i class="fa-solid fa-shield-heart" style="color: var(--neon-pink);"></i>
        </div>
    </div>

    <!-- Start Screen -->
    <div class="screen-overlay" id="start-screen">
        <div class="menu-panel">
            <div class="title">NEON STRIKE</div>
            <div class="subtitle">霓虹战机：极速星海</div>
            
            <button class="btn" id="start-btn">
                <i class="fa-solid fa-play"></i> 开始战斗
            </button>
            
            <button class="btn btn-settings" id="controls-btn">
                <i class="fa-solid fa-keyboard"></i> 键鼠 / 触屏 双控制
            </button>

            <div class="score-list">
                <div style="font-weight: 700; margin-bottom: 8px; color: var(--neon-blue); text-align: center;">🛡️ 历史最佳战绩</div>
                <div id="high-scores-container">
                    <div style="text-align: center; color: var(--text-muted, #9ca3af); font-size: 13px; padding: 10px;">暂无战绩，等待英雄起航！</div>
                </div>
            </div>

            <div class="controls-tip">
                <span><i class="fa-solid fa-arrows-up-down-left-right"></i> WASD / 鼠标 移动</span>
                <span><i class="fa-solid fa-circle-play"></i> 点击 / 空格 射击</span>
            </div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div class="screen-overlay hidden" id="gameover-screen">
        <div class="menu-panel">
            <div class="title" style="background: linear-gradient(135deg, var(--neon-pink) 0%, var(--neon-purple) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px rgba(255, 0, 127, 0.4));">MISSION FAILED</div>
            <div class="subtitle" style="color: var(--neon-pink);">战机已损毁</div>

            <div style="margin-bottom: 25px;">
                <div style="font-size: 16px; color: var(--text-muted, #9ca3af);">最终得分</div>
                <div style="font-size: 40px; font-weight: 900; font-family: 'Orbitron', sans-serif; color: var(--neon-blue); text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);" id="final-score">0</div>
                <div style="font-size: 14px; color: var(--neon-purple); margin-top: 5px;" id="new-high-score-label"></div>
            </div>
            
            <button class="btn" id="restart-btn">
                <i class="fa-solid fa-rotate-right"></i> 重新出击
            </button>
            <button class="btn btn-settings" id="back-to-menu-btn">
                <i class="fa-solid fa-house"></i> 返回主菜单
            </button>
        </div>
    </div>

    <!-- Audio Toggle -->
    <div class="volume-control" id="volume-toggle" title="开启/关闭声音">
        <i class="fa-solid fa-volume-high" id="volume-icon" style="color: var(--neon-blue); font-size: 18px;"></i>
    </div>

    <!-- Game Canvas -->
    <canvas id="game-canvas"></canvas>
</div>

<script>
    // ---------- 浏览器自适应设置 ----------
    const canvas = document.getElementById("game-canvas");
    const ctx = canvas.getContext("2d");

    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    window.addEventListener("resize", () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    });

    // ---------- 音频生成系统 (Web Audio API) ----------
    let audioEnabled = true;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    const volumeToggle = document.getElementById("volume-toggle");
    const volumeIcon = document.getElementById("volume-icon");

    volumeToggle.addEventListener("click", () => {
        audioEnabled = !audioEnabled;
        if (audioEnabled) {
            volumeIcon.className = "fa-solid fa-volume-high";
            initAudio();
        } else {
            volumeIcon.className = "fa-solid fa-volume-xmark";
        }
    });

    // 播放合成音效函数
    function playLaserSound() {
        if (!audioEnabled) return;
        initAudio();
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.15);

            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } catch(e) {}
    }

    function playExplosionSound() {
        if (!audioEnabled) return;
        initAudio();
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        } catch(e) {}
    }

    function playPowerUpSound() {
        if (!audioEnabled) return;
        initAudio();
        try {
            const notes = [261.63, 329.63, 392.00, 523.25]; // C E G C (Arpeggio)
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime + idx * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.08 + 0.15);

                osc.start(audioCtx.currentTime + idx * 0.08);
                osc.stop(audioCtx.currentTime + idx * 0.08 + 0.15);
            });
        } catch(e) {}
    }

    function playHitSound() {
        if (!audioEnabled) return;
        initAudio();
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);

            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } catch(e) {}
    }

    // ---------- 粒子特效类 ----------
    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.size = Math.random() * 3 + 1;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 4 + 1;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.alpha = 1;
            this.decay = Math.random() * 0.02 + 0.015;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= this.decay;
        }

        draw(ctx) {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    // ---------- 游戏核心类与逻辑 ----------
    let score = 0;
    let level = 1;
    let hp = 100;
    let gameState = "start"; // start, playing, gameover
    let screenShake = 0;

    let player = {
        x: 0,
        y: 0,
        size: 24,
        speed: 8,
        weaponLevel: 1, // 1: single, 2: double, 3: triple
        shield: 0, // shield timer
        shootCooldown: 0
    };

    let stars = [];
    let lasers = [];
    let enemyLasers = [];
    let enemies = [];
    let particles = [];
    let powerUps = [];

    // 初始化星空背景
    function initStars() {
        stars = [];
        for (let i = 0; i < 120; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 1.5 + 0.5,
                color: Math.random() > 0.5 ? '#00f0ff' : '#ffffff'
            });
        }
    }

    // 初始化玩家位置
    function initPlayer() {
        player.x = width / 2;
        player.y = height - 100;
        player.weaponLevel = 1;
        player.shield = 0;
        hp = 100;
    }

    // 键盘监听状态
    const keys = {};
    window.addEventListener("keydown", (e) => { keys[e.code] = true; if (e.code === "Space") e.preventDefault(); });
    window.addEventListener("keyup", (e) => { keys[e.code] = false; });

    // 鼠标/触屏 移动控制
    let targetX = width / 2;
    let targetY = height - 100;
    let usePointer = false;

    window.addEventListener("mousemove", (e) => {
        usePointer = true;
        targetX = e.clientX;
        targetY = e.clientY;
    });

    window.addEventListener("touchmove", (e) => {
        usePointer = true;
        if (e.touches.length > 0) {
            targetX = e.touches[0].clientX;
            targetY = e.touches[0].clientY;
        }
    }, { passive: true });

    // 触发屏幕震动
    function shakeCamera(amount) {
        screenShake = amount;
    }

    // 粒子爆炸
    function createExplosion(x, y, color, count = 20) {
        playExplosionSound();
        for (let i = 0; i < count; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    // 生成道具
    function spawnPowerUp(x, y) {
        const rand = Math.random();
        let type = 'heal';
        let color = '#38d996';
        let icon = '✚';

        if (rand < 0.35) {
            type = 'weapon';
            color = '#00f0ff';
            icon = '⚡';
        } else if (rand < 0.70) {
            type = 'shield';
            color = '#a855f7';
            icon = '🛡️';
        }

        powerUps.push({
            x: x,
            y: y,
            type: type,
            color: color,
            icon: icon,
            size: 15,
            vy: 2
        });
    }

    // 敌机生成规则
    let enemySpawnTimer = 0;

    function handleEnemySpawning() {
        enemySpawnTimer--;
        if (enemySpawnTimer <= 0) {
            // 根据等级缩短生成时间
            enemySpawnTimer = Math.max(20, 60 - level * 4);
            
            const randType = Math.random();
            let enemyColor = '#ff007f';
            let enemyHp = 1;
            let enemySize = 18;
            let speed = Math.random() * 2 + 1.5 + (level * 0.1);
            let shootProb = 0.005 + (level * 0.002);
            let scoreVal = 100;

            if (randType < 0.2 && level >= 2) {
                // 精英敌机
                enemyColor = '#a855f7';
                enemyHp = 3;
                enemySize = 25;
                speed = Math.random() * 1.5 + 1;
                shootProb = 0.02;
                scoreVal = 300;
            }

            enemies.push({
                x: Math.random() * (width - 60) + 30,
                y: -40,
                size: enemySize,
                color: enemyColor,
                hp: enemyHp,
                maxHp: enemyHp,
                vy: speed,
                vx: (Math.random() - 0.5) * 1,
                shootProb: shootProb,
                score: scoreVal
            });
        }
    }

    // ---------- 更新游戏状态 ----------
    function update() {
        if (gameState !== "playing") return;

        // 1. 屏幕震动衰减
        if (screenShake > 0) screenShake -= 0.5;

        // 2. 玩家移动逻辑
        if (usePointer) {
            // 平滑缓动跟随鼠标/触屏
            player.x += (targetX - player.x) * 0.15;
            player.y += (targetY - player.y) * 0.15;
        } else {
            // 键盘按键移动
            if (keys["KeyW"] || keys["ArrowUp"]) player.y -= player.speed;
            if (keys["KeyS"] || keys["ArrowDown"]) player.y += player.speed;
            if (keys["KeyA"] || keys["ArrowLeft"]) player.x -= player.speed;
            if (keys["KeyD"] || keys["ArrowRight"]) player.x += player.speed;
        }

        // 玩家边界限制
        player.x = Math.max(player.size, Math.min(width - player.size, player.x));
        player.y = Math.max(player.size + 80, Math.min(height - player.size - 20, player.y));

        // 3. 护盾逻辑
        if (player.shield > 0) player.shield--;

        // 4. 发射子弹逻辑 (键盘空格或鼠标左键长按)
        player.shootCooldown--;
        if ((keys["Space"] || keys["MouseDown"]) && player.shootCooldown <= 0) {
            player.shootCooldown = 10; // 射击间隔
            playLaserSound();

            if (player.weaponLevel === 1) {
                // 单发
                lasers.push({ x: player.x, y: player.y - player.size, vy: -12, color: '#00f0ff' });
            } else if (player.weaponLevel === 2) {
                // 双发
                lasers.push({ x: player.x - 10, y: player.y - player.size, vy: -12, color: '#00f0ff' });
                lasers.push({ x: player.x + 10, y: player.y - player.size, vy: -12, color: '#00f0ff' });
            } else {
                // 三连发
                lasers.push({ x: player.x, y: player.y - player.size, vy: -14, color: '#00f0ff' });
                lasers.push({ x: player.x - 16, y: player.y - 10, vy: -12, vx: -2, color: '#06b6d4' });
                lasers.push({ x: player.x + 16, y: player.y - 10, vy: -12, vx: 2, color: '#06b6d4' });
            }
        }

        // 5. 更新背景星空
        stars.forEach(star => {
            star.y += star.speed;
            if (star.y > height) {
                star.y = 0;
                star.x = Math.random() * width;
            }
        });

        // 6. 更新玩家子弹
        for (let i = lasers.length - 1; i >= 0; i--) {
            const l = lasers[i];
            l.y += l.vy;
            if (l.vx) l.x += l.vx;
            if (l.y < 0 || l.x < 0 || l.x > width) {
                lasers.splice(i, 1);
            }
        }

        // 7. 更新敌机子弹
        for (let i = enemyLasers.length - 1; i >= 0; i--) {
            const el = enemyLasers[i];
            el.y += el.vy;
            if (el.y > height) {
                enemyLasers.splice(i, 1);
                continue;
            }

            // 检测击中玩家
            const dist = Math.hypot(el.x - player.x, el.y - player.y);
            if (dist < player.size + 4) {
                enemyLasers.splice(i, 1);
                if (player.shield <= 0) {
                    hp = Math.max(0, hp - 15);
                    shakeCamera(8);
                    playHitSound();
                    if (hp <= 0) triggerGameOver();
                } else {
                    createExplosion(el.x, el.y, '#a855f7', 8);
                }
            }
        }

        // 8. 道具下落与拾取
        for (let i = powerUps.length - 1; i >= 0; i--) {
            const p = powerUps[i];
            p.y += p.vy;
            if (p.y > height) {
                powerUps.splice(i, 1);
                continue;
            }

            const dist = Math.hypot(p.x - player.x, p.y - player.y);
            if (dist < player.size + p.size) {
                playPowerUpSound();
                if (p.type === 'heal') {
                    hp = Math.min(100, hp + 30);
                    showToast("生命值恢复！");
                } else if (p.type === 'weapon') {
                    player.weaponLevel = Math.min(3, player.weaponLevel + 1);
                    showToast("火力武器升级！");
                } else if (p.type === 'shield') {
                    player.shield = 400; // 约 6.6 秒护盾
                    showToast("获得电磁护盾！");
                }
                powerUps.splice(i, 1);
            }
        }

        // 9. 更新敌机
        handleEnemySpawning();
        for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            e.y += e.vy;
            if (e.vx) e.x += e.vx;

            // 边缘反弹
            if (e.x < e.size || e.x > width - e.size) e.vx *= -1;

            if (e.y > height + 40) {
                enemies.splice(i, 1);
                continue;
            }

            // 敌机开火
            if (Math.random() < e.shootProb) {
                enemyLasers.push({ x: e.x, y: e.y + e.size, vy: 6 + (level * 0.2) });
            }

            // 敌机同玩家机身碰撞检测
            const distToPlayer = Math.hypot(e.x - player.x, e.y - player.y);
            if (distToPlayer < player.size + e.size) {
                createExplosion(e.x, e.y, e.color, 15);
                enemies.splice(i, 1);
                if (player.shield <= 0) {
                    hp = Math.max(0, hp - 30);
                    shakeCamera(15);
                    playHitSound();
                    if (hp <= 0) triggerGameOver();
                } else {
                    shakeCamera(5);
                }
                continue;
            }

            // 玩家子弹与敌机碰撞检测
            let enemyDestroyed = false;
            for (let j = lasers.length - 1; j >= 0; j--) {
                const l = lasers[j];
                const distToBullet = Math.hypot(e.x - l.x, e.y - l.y);
                if (distToBullet < e.size + 4) {
                    lasers.splice(j, 1);
                    e.hp--;
                    createExplosion(l.x, l.y, '#00f0ff', 4);

                    if (e.hp <= 0) {
                        createExplosion(e.x, e.y, e.color, 18);
                        score += e.score;
                        
                        // 随机爆道具（概率12%）
                        if (Math.random() < 0.12) {
                            spawnPowerUp(e.x, e.y);
                        }

                        // 动态升级关卡
                        if (score > level * 3000) {
                            level++;
                            playPowerUpSound();
                            showToast(`关卡升级！进入第 ${level} 阶段！`);
                        }

                        enemies.splice(i, 1);
                        enemyDestroyed = true;
                        break;
                    }
                }
            }
        }

        // 10. 更新粒子
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            if (particles[i].alpha <= 0) {
                particles.splice(i, 1);
            }
        }

        // 更新 HUD 元素
        document.getElementById("hud-score-val").innerText = String(score).padStart(6, '0');
        document.getElementById("hud-level-val").innerText = `LV. ${level}`;
        document.getElementById("hud-hp-fill").style.width = `${hp}%`;
    }

    // ---------- 渲染页面逻辑 ----------
    function draw() {
        ctx.save();
        
        // 执行屏幕震动
        if (screenShake > 0) {
            const dx = (Math.random() - 0.5) * screenShake;
            const dy = (Math.random() - 0.5) * screenShake;
            ctx.translate(dx, dy);
        }

        ctx.clearRect(0, 0, width, height);

        // 1. 绘制背景星空
        stars.forEach(star => {
            ctx.fillStyle = star.color;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });

        // 2. 绘制道具
        powerUps.forEach(p => {
            ctx.save();
            ctx.shadowBlur = 10;
            ctx.shadowColor = p.color;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            
            // 道具图案
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(p.icon, p.x, p.y);
            ctx.restore();
        });

        // 3. 绘制玩家子弹
        lasers.forEach(l => {
            ctx.save();
            ctx.shadowBlur = 12;
            ctx.shadowColor = l.color;
            ctx.strokeStyle = l.color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(l.x, l.y);
            ctx.lineTo(l.x, l.y + 12);
            ctx.stroke();
            ctx.restore();
        });

        // 4. 绘制敌机子弹
        enemyLasers.forEach(el => {
            ctx.save();
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff007f';
            ctx.fillStyle = '#ff007f';
            ctx.beginPath();
            ctx.arc(el.x, el.y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });

        // 5. 绘制敌机
        enemies.forEach(e => {
            ctx.save();
            ctx.shadowBlur = 12;
            ctx.shadowColor = e.color;
            ctx.fillStyle = e.color;

            // 绘制尖三角形战机形状
            ctx.beginPath();
            ctx.moveTo(e.x, e.y + e.size);
            ctx.lineTo(e.x - e.size, e.y - e.size);
            ctx.lineTo(e.x + e.size, e.y - e.size);
            ctx.closePath();
            ctx.fill();

            // 绘制敌机血条（如果是精英怪）
            if (e.maxHp > 1) {
                const barWidth = e.size * 2;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(e.x - e.size, e.y - e.size - 10, barWidth, 4);
                ctx.fillStyle = '#38d996';
                ctx.fillRect(e.x - e.size, e.y - e.size - 10, barWidth * (e.hp / e.maxHp), 4);
            }
            ctx.restore();
        });

        // 6. 绘制爆炸粒子
        particles.forEach(p => p.draw(ctx));

        // 7. 绘制玩家战机
        if (gameState === "playing") {
            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = varColor('--neon-blue');
            ctx.fillStyle = varColor('--neon-blue');

            // 绘制前卫科幻三角机身
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.size); // 机头
            ctx.lineTo(player.x - player.size, player.y + player.size); // 左翼
            ctx.lineTo(player.x - player.size / 3, player.y + player.size / 2);
            ctx.lineTo(player.x + player.size / 3, player.y + player.size / 2);
            ctx.lineTo(player.x + player.size, player.y + player.size); // 右翼
            ctx.closePath();
            ctx.fill();

            // 引擎火焰喷射特效
            ctx.shadowColor = varColor('--neon-pink');
            ctx.fillStyle = varColor('--neon-pink');
            ctx.beginPath();
            ctx.moveTo(player.x - 6, player.y + player.size / 2);
            ctx.lineTo(player.x, player.y + player.size / 2 + (Math.random() * 15 + 5));
            ctx.lineTo(player.x + 6, player.y + player.size / 2);
            ctx.closePath();
            ctx.fill();

            // 绘制电磁护盾
            if (player.shield > 0) {
                ctx.strokeStyle = varColor('--neon-purple');
                ctx.shadowColor = varColor('--neon-purple');
                ctx.shadowBlur = 15;
                ctx.lineWidth = 3 + Math.sin(Date.now() * 0.02) * 1.5;
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.size * 1.8, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        ctx.restore();
    }

    // 辅助获取 CSS 变量值
    function varColor(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    // ---------- 游戏主循环 ----------
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // ---------- 游戏生命周期控制 ----------
    const startScreen = document.getElementById("start-screen");
    const gameoverScreen = document.getElementById("gameover-screen");

    function startGame() {
        initAudio();
        score = 0;
        level = 1;
        initStars();
        initPlayer();
        
        lasers = [];
        enemyLasers = [];
        enemies = [];
        particles = [];
        powerUps = [];
        
        gameState = "playing";
        startScreen.classList.add("hidden");
        gameoverScreen.classList.add("hidden");
    }

    function triggerGameOver() {
        gameState = "gameover";
        playExplosionSound();
        shakeCamera(30);
        createExplosion(player.x, player.y, varColor('--neon-blue'), 40);
        
        document.getElementById("final-score").innerText = score;
        
        // 纪录高分
        const isNewRecord = saveScore(score);
        const newRecordLabel = document.getElementById("new-high-score-label");
        if (isNewRecord) {
            newRecordLabel.innerText = "🏆 恭喜创造全新最佳纪录！";
            newRecordLabel.style.display = "block";
        } else {
            newRecordLabel.style.display = "none";
        }

        setTimeout(() => {
            gameoverScreen.classList.remove("hidden");
            loadHighScoreList();
        }, 1000);
    }

    // ---------- 高分记录系统 ----------
    const HIGH_SCORES_KEY = "neon_strike_high_scores_v1";

    function getHighScores() {
        try {
            const list = localStorage.getItem(HIGH_SCORES_KEY);
            return list ? JSON.parse(list) : [];
        } catch(e) {
            return [];
        }
    }

    function saveScore(scoreVal) {
        if (scoreVal <= 0) return false;
        let list = getHighScores();
        const minVal = list.length >= 5 ? list[list.length - 1] : 0;
        
        let newRecord = false;
        if (list.length === 0 || scoreVal > list[0]) {
            newRecord = true;
        }

        list.push(scoreVal);
        list.sort((a, b) => b - a);
        list = list.slice(0, 5); // 只留前五名
        
        localStorage.setItem(HIGH_SCORES_KEY, JSON.stringify(list));
        return newRecord;
    }

    function loadHighScoreList() {
        const list = getHighScores();
        const container = document.getElementById("high-scores-container");
        if (list.length === 0) {
            container.innerHTML = `<div style="text-align: center; color: var(--text-muted, #9ca3af); font-size: 13px; padding: 10px;">暂无战绩，等待英雄起航！</div>`;
            return;
        }
        
        let html = "";
        list.forEach((scoreVal, index) => {
            const medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : "✈️";
            html += `
                <div class="score-item">
                    <span><span class="rank">${medal} 第 ${index + 1} 名</span></span>
                    <span class="val">${String(scoreVal).padStart(6, '0')}</span>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // ---------- Toast 浮动提示 ----------
    function showToast(msg) {
        const toast = document.createElement("div");
        toast.style.position = "absolute";
        toast.style.top = "90px";
        toast.style.left = "50%";
        toast.style.transform = "translateX(-50%)";
        toast.style.background = "var(--panel-bg)";
        toast.style.border = "1px solid var(--neon-blue)";
        toast.style.color = "var(--neon-blue)";
        toast.style.padding = "8px 16px";
        toast.style.borderRadius = "8px";
        toast.style.fontSize = "14px";
        toast.style.fontWeight = "bold";
        toast.style.textShadow = "0 0 5px rgba(0, 240, 255, 0.4)";
        toast.style.boxShadow = "0 0 10px rgba(0, 240, 255, 0.2)";
        toast.style.animation = "toastAnim 1.2s forwards";
        toast.style.pointerEvents = "none";
        toast.style.zIndex = "1000";
        toast.innerText = msg;
        
        document.getElementById("game-container").appendChild(toast);
        
        setTimeout(() => {
            toast.remove();
        }, 1200);
    }

    // 动态生成 Toast CSS 动画
    const styleSheet = document.createElement("style");
    styleSheet.innerText = `
        @keyframes toastAnim {
            0% { opacity: 0; transform: translate(-50%, 20px); }
            15% { opacity: 1; transform: translate(-50%, 0); }
            85% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }
    `;
    document.head.appendChild(styleSheet);

    // ---------- 事件关联 ----------
    document.getElementById("start-btn").addEventListener("click", startGame);
    document.getElementById("restart-btn").addEventListener("click", startGame);
    document.getElementById("back-to-menu-btn").addEventListener("click", () => {
        gameState = "start";
        startScreen.classList.remove("hidden");
        gameoverScreen.classList.add("hidden");
        loadHighScoreList();
    });

    // 鼠标点击/长按射击判定
    window.addEventListener("mousedown", () => { keys["MouseDown"] = true; });
    window.addEventListener("mouseup", () => { keys["MouseDown"] = false; });
    window.addEventListener("touchstart", () => { keys["MouseDown"] = true; }, { passive: true });
    window.addEventListener("touchend", () => { keys["MouseDown"] = false; }, { passive: true });

    // 初始化渲染
    initStars();
    loadHighScoreList();
    gameLoop();
</script>
</body>
</html>
