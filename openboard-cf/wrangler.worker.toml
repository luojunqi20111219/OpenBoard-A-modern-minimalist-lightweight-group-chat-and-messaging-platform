#:schema node_modules/wrangler/config-schema.json
#
# 备选部署方式：把 API + Durable Object 打成一个 Worker（不含前端静态资源）
#
#   npx wrangler deploy --config wrangler.worker.toml
#   npx wrangler dev    --config wrangler.worker.toml   # 本地调试
#
# 适合想把 API 挂在独立域名（如 api.example.com）的场景。
# 默认方案是 Pages（前端 + Functions），见 wrangler.toml。
name = "openboard-api"
main = "src/worker.ts"
compatibility_date = "2024-11-27"

# ---------------------------------------------------------------------------
# KV —— 登录限流计数 + 在线状态快照
#
# ⚠️ KV 是最终一致存储，绝不可用于用户账号 / 会话 / 封禁状态（会造成安全问题）。
#    它只承担"偶尔漏一次也无所谓"的数据：限流计数、可陈旧的在线快照。
#    业务数据一律走 D1，文件走 R2。
#
# 创建：npx wrangler kv namespace create openboard-kv
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_YOUR_KV_ID"

[[d1_databases]]
binding = "DB"
database_name = "openboard-db"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "openboard-uploads"

[[durable_objects.bindings]]
name = "CHAT_HUB"
class_name = "ChatHub"

[[migrations]]
tag = "v1"
new_classes = ["ChatHub"]

[vars]
JWT_SECRET = ""
CURRENT_VERSION = "v9.0.0"
ALLOWED_ADMINS = "官方账号,Forest_siri,Forest_Brian_Birch"
MAX_CONNECTIONS_PER_USER = "4"
# 是否允许免鉴权读取 R2 中的上传文件（图片直链需要），设 false 则强制登录
PUBLIC_UPLOADS = "true"
