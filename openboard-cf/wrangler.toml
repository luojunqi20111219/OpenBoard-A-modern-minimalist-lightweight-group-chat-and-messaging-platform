#:schema node_modules/wrangler/config-schema.json
#
# ===========================================================================
# OpenBoard · Cloudflare Workers 全栈部署
# ===========================================================================
#
#   npx wrangler deploy      # 部署
#   npx wrangler dev         # 本地调试
#
# ---------------------------------------------------------------------------
# 架构说明（为什么是 Workers 而不是 Pages）
# ---------------------------------------------------------------------------
# 早期版本部署在 Pages Functions + 独立 DO Worker（script_name 跨引用）。
# 该组合不受 Cloudflare 支持：普通 HTTP 正常，但 WebSocket 升级一律
# 500（error code 1101），因为带 webSocket 属性的 101 响应无法穿过
# Pages → DO 的服务绑定边界，且异常发生在运行时层，try/catch 拦不住。
#
# 官方兼容性矩阵：`Durable Objects: Only available on Workers`。
# 因此改为单个 Worker 承载：静态资源（assets）+ API（Hono）+ DO（同 Worker 绑定）。
# 好处：WebSocket 直通、少一次跨服务调用、可用 Cron 与完整可观测性。
#
# 静态资源请求与 Pages 一样不额外计费。
# ---------------------------------------------------------------------------
name = "openboard"
# main 指向 **构建产物** 而不是 src/worker.ts。
#
# 原因：数据库导入功能依赖 sql.js（CommonJS 包），Wrangler 自带的 bundler
# 会把 `import initSqlJs from 'sql.js'` 当成磁盘路径去找（ENOENT: .../sql.js）。
# 因此先由 esbuild 打包成标准 ESM（scripts/build-import.mjs），
# 产物再交给 wrangler 上传。
#
# ⚠️ 改动源码后必须先 `npm run bundle`，直接 deploy 会发布旧代码。
main = "dist/worker.js"
compatibility_date = "2024-11-27"

# ---------------------------------------------------------------------------
# 模块规则
#
# ⚠️ 这里**不能**用 [wasm_modules] 绑定 wasm —— wrangler 会直接报错：
#     "You cannot configure [wasm_modules] with an ES module worker.
#      Instead, import the .wasm module directly in your code"
#
#   因此改用 ESM 原生方式：代码里直接 `import wasm from './sql-wasm.wasm'`
#   （见 src/import/sqljs.ts），打包时保持该导入不被内联
#   （scripts/build-import.mjs 中标记为 external），
#   再由下面的 CompiledWasm 规则把 .wasm 作为模块处理并随 Worker 上传。
#
#   注：早期曾用「独立 bundle + 动态 import」想按需加载 wasm，
#   但 wrangler 打包不跟随动态 import，wasm 根本不会被上传，已废弃该方案。
# ---------------------------------------------------------------------------
[[rules]]
type = "ESModule"
globs = ["**/*.js"]
fallthrough = true

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true
# ---------------------------------------------------------------------------
[[rules]]
type = "ESModule"
globs = ["**/*.js"]
fallthrough = true

# ---------------------------------------------------------------------------
# 静态资源（原 Pages 的 public/ 目录）
#
# binding = "ASSETS" 让 Worker 代码可通过 env.ASSETS 读取文件。
#
# ⚠️ run_worker_first 是这里的关键，绝不能省：
#    Worker 带 assets 时的默认行为是「静态资源优先，未匹配才走 Worker」。
#    配合 not_found_handling = "single-page-application"（未找到即回 index.html），
#    /api/* 和 /ws/* 都会被当成「没找到这个静态文件」而直接返回 index.html，
#    表现为接口全部 404、WebSocket 握手 404 —— 且没有任何报错提示。
#    因此必须显式声明这些前缀由 Worker 先处理。
# ---------------------------------------------------------------------------
[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /upload 与 /api/import 也必须走 Worker（否则会被 SPA 回退吞成 index.html）
run_worker_first = ["/api/*", "/ws", "/ws/*", "/upload", "/uploads", "/uploads/*", "/contact-admin"]

# ---------------------------------------------------------------------------
# D1 数据库（原 SQLite board.db）
# 创建：npx wrangler d1 create openboard-db
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "openboard-db"
database_id = "1f6015cb-09ba-490c-b083-145a7be040db"

# ---------------------------------------------------------------------------
# KV —— 登录限流计数 + 在线状态快照
#
# ⚠️ KV 是最终一致存储，绝不可用于用户账号 / 会话 / 封禁状态（会造成安全问题）。
#    它只承担"偶尔漏一次也无所谓"的数据：限流计数、可陈旧的在线快照。
#    业务数据一律走 D1，文件走 R2。
#
# 创建：npx wrangler kv namespace create openboard-kv
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "c9ef480d69c942e4abfd6ccf68be999a"

# ---------------------------------------------------------------------------
# R2 存储（原本地 uploads/ 目录）
# 创建：npx wrangler r2 bucket create openboard-uploads
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "openboard-uploads"

# ---------------------------------------------------------------------------
# Durable Object —— WebSocket 实时广播中枢
#
# 与原 Pages 方案的唯一区别：**不再有 script_name**。
# DO 类与 Worker 在同一个脚本内，迁移直接生效，不需要先部署独立的 DO Worker。
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "CHAT_HUB"
class_name = "ChatHub"

[[migrations]]
tag = "v1"
# ⚠️ 必须是 new_sqlite_classes，不能是 new_classes。
#    Free 计划的 Durable Objects 只支持 SQLite 存储后端，用 new_classes
#    会报错：In order to use Durable Objects with a free plan, you must
#    create a namespace using a `new_sqlite_classes` migration. [code: 10097]
new_sqlite_classes = ["ChatHub"]

# ---------------------------------------------------------------------------
# 环境变量 / 密钥
# 生产环境请用 `npx wrangler secret put JWT_SECRET` 写入，别把真密钥写这里
# ---------------------------------------------------------------------------
[vars]
# ⚠️ JWT_SECRET 不在这里配置！
#    它是 secret，必须用 `npx wrangler secret put JWT_SECRET` 写入。
#    若在 [vars] 里也声明同名变量，secret put 会报
#    "Binding name 'JWT_SECRET' already in use" [code: 10053]。
#    本文件也不该出现真实密钥（会进 git 历史）。
CURRENT_VERSION = "v10.1.0"
# PBKDF2 迭代次数。Free 计划 CPU 上限 10ms，210000 次必然超限导致
# 登录/注册全部 500，故 Free 套餐请留空（用代码内 10000 的默认值）；
# 升级到 Paid（CPU 上限 30s）后可设为 210000 提升安全性。
# 已存在的哈希自带迭代次数，调整此值不会让已有密码失效。
PASSWORD_ITERATIONS = ""
# 逗号分隔的管理员用户名。
#
# ⚠️ 这是**保底通道**：权限判定顺序是 role=1 → 本名单 → D1 users.is_admin。
#    本名单必须在 D1 之前，否则一旦误删 is_admin 就再没有人能进管理端。
#    正常增删管理员请用管理端 App（写 D1），这里只保留"绝对不能再进不去"的账号。
#    注意用户名必须与 users.username 完全一致（含大小写）。
ALLOWED_ADMINS = "官方账号,Forest_siri,Brian_Birch"
MAX_CONNECTIONS_PER_USER = "4"
# 是否允许免鉴权读取 R2 中的上传文件（图片直链需要），设 false 则强制登录
PUBLIC_UPLOADS = "true"

# ---------------------------------------------------------------------------
# 可观测性 —— WebSocket / DO 的问题不会体现在响应体里，必须靠日志定位
# ---------------------------------------------------------------------------
[observability]
enabled = true
