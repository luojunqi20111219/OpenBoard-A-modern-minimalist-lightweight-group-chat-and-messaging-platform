<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信语 (OpenBoard) | 现代群聊与私聊</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .msg-appear { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .avatar-gradient { background: linear-gradient(135deg, #4F46E5 0%, #06B6D4 100%); }
    </style>
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden font-sans">

    <!-- 自定义右键/长按上下文菜单 -->
    <div id="custom-context-menu" class="hidden fixed bg-white/95 backdrop-blur-md border border-gray-200/80 shadow-2xl rounded-2xl p-1.5 z-[9999] min-w-[140px] flex flex-col gap-1 transition-all duration-150 transform scale-95 opacity-0">
        <button id="menu-btn-favorite" class="w-full text-left px-3 py-2 text-xs font-semibold text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-xl transition flex items-center gap-2">
            <i class="fa-regular fa-star text-blue-500"></i>收藏表情
        </button>
        <button id="menu-btn-download" class="w-full text-left px-3 py-2 text-xs font-semibold text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-xl transition flex items-center gap-2">
            <i class="fa-solid fa-download text-blue-500"></i>下载/保存图片
        </button>
        <button id="menu-btn-copy-link" class="w-full text-left px-3 py-2 text-xs font-semibold text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-xl transition flex items-center gap-2">
            <i class="fa-regular fa-copy text-blue-500"></i>复制链接
        </button>
    </div>

    <aside class="w-64 bg-gray-900 text-white flex flex-col h-full shadow-2xl z-20 shrink-0">
        <div class="p-5 border-b border-gray-800 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight flex items-center">
                <img src="/favicon.ico" alt="logo" class="w-7 h-7 mr-2 drop-shadow-md">信语
            </h1>
            <button onclick="showProfile()" class="text-gray-400 hover:text-white transition" title="个人设置" id="btn-settings" style="display:none;">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto no-scrollbar pb-4">
            <div class="p-4 pb-2 text-xs font-bold text-gray-500 uppercase tracking-widest flex justify-between items-center">
                <span>群聊频道</span>
                <button onclick="showCreateGroup()" class="hover:text-white transition" title="新建群聊"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div id="channel-list" class="px-3 space-y-1"></div>

            <div class="p-4 pb-2 mt-2 border-t border-gray-800 text-xs font-bold text-gray-500 uppercase tracking-widest flex justify-between items-center">
                <span>我的好友</span>
                <div class="flex items-center gap-2">
                    <!-- 好友申请通知红点 -->
                    <button onclick="showFriendRequestsModal()" class="relative hover:text-white transition text-gray-400" title="好友申请">
                        <i class="fa-solid fa-user-plus text-sm"></i>
                        <span id="friend-req-badge" class="hidden absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                    </button>
                    <button onclick="showSearchFriendsModal()" class="hover:text-white transition text-gray-400" title="添加好友">
                        <i class="fa-solid fa-magnifying-glass text-sm"></i>
                    </button>
                </div>
            </div>
            <div id="user-list" class="px-3 space-y-1">
                <div class="text-gray-500 text-xs px-2 italic">请先登录以查看</div>
            </div>
        </div>

        <div class="p-4 bg-gray-950 border-t border-gray-800 shrink-0">
            <div id="user-info" class="flex items-center justify-between">
                <button onclick="showLogin()" class="w-full bg-blue-600 py-2 rounded-lg text-sm font-bold hover:bg-blue-500 transition">登录 / 注册</button>
            </div>
            <a href="/admin" class="block mt-3 text-center text-xs text-gray-600 hover:text-blue-400 transition">
                <i class="fa-solid fa-shield-halved mr-1"></i>系统管理后台
            </a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full bg-white relative">
        <header class="h-16 border-b flex items-center justify-between px-6 shrink-0 bg-white/80 backdrop-blur-md sticky top-0 z-10">
            <div class="flex items-center">
                <div id="header-icon" class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center text-blue-600 mr-3 overflow-hidden">
                    <i class="fa-solid fa-hashtag text-xl"></i>
                </div>
                <div>
                    <h2 class="font-bold text-gray-800 flex items-center">
                        <span id="room-title">公共大厅</span>
                        <button id="room-manage-btn" onclick="showManageGroup()" class="ml-2 text-gray-400 hover:text-blue-500 hidden transition"><i class="fa-solid fa-gear"></i></button>
                        <button id="user-block-btn" onclick="confirmDeleteFriend()" class="ml-2 text-gray-400 hover:text-red-500 hidden transition" title="删除好友"><i class="fa-solid fa-user-minus"></i></button>
                    </h2>
                    <p class="text-xs text-gray-400 flex items-center" id="connection-status">
                        <span class="w-1.5 h-1.5 bg-gray-400 rounded-full mr-1.5" id="status-dot"></span>
                        <span id="status-text">未连接</span>
                    </p>
                    <div id="typing-indicator" class="text-[10px] text-blue-500 mt-0.5 hidden animate-pulse italic">有人正在输入...</div>
                </div>
            </div>

            <div class="flex items-center gap-4 relative">
                <a href="https://github.com/luojunqi20111219/OpenBoard-A-modern-minimalist-lightweight-group-chat-and-messaging-platform" target="_blank" class="text-gray-400 hover:text-gray-700 transition p-2" title="GitHub"><svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
                <div id="notice-btn" class="relative cursor-pointer text-gray-400 hover:text-blue-600 transition p-2" title="系统消息公告" onclick="toggleNoticeDropdown(event)">
                    <i class="fa-solid fa-bell text-xl"></i>
                    <span id="notice-badge" class="hidden absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-red-500 border-2 border-white rounded-full"></span>
                </div>
                
                <!-- 通知下拉框 -->
                <div id="notice-dropdown" class="hidden absolute top-full right-0 mt-2 w-72 bg-white rounded-2xl shadow-2xl border border-gray-100 z-50 overflow-hidden">
                    <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                        <span class="font-bold text-sm text-gray-700">📢 系统公告消息</span>
                        <button onclick="markAllNoticesRead()" class="text-[10px] text-blue-600 hover:underline">全部已读</button>
                    </div>
                    <div id="notice-content" class="max-h-80 overflow-y-auto p-2 space-y-2 no-scrollbar">
                        <div class="text-center py-8 text-gray-400 text-xs">暂无新消息</div>
                    </div>
                </div>
            </div>
        </header>

        <div id="msg-list" class="flex-1 overflow-y-auto p-6 space-y-6 no-scrollbar bg-gray-50/50">
            <div class="text-center py-20 text-gray-400">正在同步消息...</div>
        </div>

        <div class="p-4 border-t bg-white shrink-0">
            <div class="max-w-4xl mx-auto relative">
                <div id="emoji-picker-container" class="hidden absolute bottom-[110%] left-0 shadow-2xl rounded-2xl overflow-hidden z-50 border border-gray-200 bg-white flex flex-col w-[350px]">
                    <div id="emoji-favorites-bar" class="p-2 border-b bg-gray-50 flex flex-col gap-1 shrink-0">
                        <span class="text-[10px] font-bold text-gray-400">❤️ 我的收藏 (长按/右键选择器内表情可收藏/取消)</span>
                        <div id="emoji-favorites-list" class="flex flex-wrap gap-1">
                            <!-- 动态加载 -->
                        </div>
                    </div>
                    <emoji-picker></emoji-picker>
                </div>
                
                <div class="flex items-end gap-2 bg-gray-100 rounded-2xl p-2 shadow-inner">
                    <button onclick="toggleEmojiPicker(event)" class="text-gray-400 hover:text-yellow-500 w-10 h-10 rounded-xl flex items-center justify-center transition shrink-0" title="表情包">
                        <i class="fa-regular fa-face-smile"></i>
                    </button>
                    <button onclick="document.getElementById('file-upload').click()" class="text-gray-400 hover:text-blue-500 w-10 h-10 rounded-xl flex items-center justify-center transition shrink-0" title="上传文件/图片">
                        <i class="fa-solid fa-paperclip"></i>
                    </button>
                    <input type="file" id="file-upload" class="hidden" onchange="uploadFile(this)">
                    <textarea id="msg-input" rows="1" class="flex-1 bg-transparent border-none focus:ring-0 py-2 px-3 text-gray-700 resize-none no-scrollbar" placeholder="说点什么吧... (Enter发送)"></textarea>
                    <button onclick="sendMsg()" id="send-btn" class="bg-blue-600 text-white w-10 h-10 rounded-xl flex items-center justify-center hover:bg-blue-700 transition shadow-lg shadow-blue-500/20 shrink-0">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div id="login-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-50 backdrop-blur-sm p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-8 shadow-2xl relative overflow-hidden">
            <div class="flex justify-center space-x-6 border-b mb-6 pb-2">
                <button id="tab-login" onclick="switchAuthTab('login')" class="font-bold text-blue-600 border-b-2 border-blue-600 pb-1 px-2 transition">登录</button>
                <button id="tab-register" onclick="switchAuthTab('register')" class="font-bold text-gray-400 hover:text-gray-600 pb-1 px-2 transition">注册</button>
                <button id="tab-qr" onclick="switchAuthTab('qr')" class="font-bold text-gray-400 hover:text-gray-600 pb-1 px-2 transition">扫码登录</button>
            </div>
            <div id="auth-form-container">
                <input id="auth-u" type="text" placeholder="账号名" class="w-full mb-4 px-5 py-3.5 bg-gray-100 rounded-xl outline-none">
                <input id="auth-p" type="password" placeholder="密码" class="w-full mb-4 px-5 py-3.5 bg-gray-100 rounded-xl outline-none">
                <input id="auth-n" type="text" placeholder="设置昵称 (选填)" class="w-full mb-6 px-5 py-3.5 bg-gray-100 rounded-xl outline-none hidden">
                <button id="btn-auth-action" onclick="submitAuth()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold hover:bg-blue-700 shadow-lg shadow-blue-500/30 transition">立即登录</button>
            </div>
            <div id="qr-container" class="hidden flex flex-col items-center justify-center py-4">
                <div id="qr-code-box" class="w-48 h-48 bg-white flex items-center justify-center p-2 border rounded-2xl shadow-sm">
                    <!-- 二维码渲染区 -->
                </div>
                <div id="qr-status-msg" class="text-xs text-gray-500 mt-4 text-center">使用手机客户端扫码登录</div>
            </div>
            <button onclick="hideModal('login-modal')" class="w-full mt-4 text-sm text-gray-400 hover:text-gray-600">稍后再说</button>
        </div>
    </div>

    <div id="profile-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-50 backdrop-blur-sm p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-8 shadow-2xl max-h-screen overflow-y-auto no-scrollbar">
            <h2 class="text-2xl font-bold text-center mb-6">个人主页设置</h2>
            <div class="flex flex-col items-center mb-6">
                <div class="relative w-24 h-24 mb-3 group cursor-pointer" onclick="document.getElementById('avatar-upload').click()">
                    <div id="profile-avatar-preview" class="w-24 h-24 rounded-full flex items-center justify-center text-3xl font-bold text-white shadow-lg overflow-hidden avatar-gradient border-4 border-white"></div>
                    <div class="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-camera text-white text-xl"></i></div>
                </div>
                <input type="file" id="avatar-upload" accept="image/*" class="hidden" onchange="processAvatar(this)">
            </div>
            <input id="profile-nickname" type="text" placeholder="昵称" class="w-full mb-4 px-5 py-3 bg-gray-100 rounded-xl outline-none">
            <button onclick="saveProfile()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 mb-6">保存资料</button>
            <hr class="border-gray-100 mb-4">
            <div class="text-left mb-3"><span class="text-xs font-bold text-gray-400 uppercase tracking-widest">安全与账户</span></div>
            <div class="flex gap-2 mb-3">
                <input id="pwd-old" type="password" placeholder="原密码" class="w-1/2 px-4 py-2.5 bg-gray-100 rounded-xl outline-none text-sm">
                <input id="pwd-new" type="password" placeholder="新密码" class="w-1/2 px-4 py-2.5 bg-gray-100 rounded-xl outline-none text-sm">
            </div>
            <button onclick="changePassword()" class="w-full bg-gray-800 text-white py-2.5 rounded-xl font-bold hover:bg-gray-900 text-sm mb-3 transition">修改密码</button>
            
            <hr class="border-gray-100 mb-4">
            <div class="text-left mb-3"><span class="text-xs font-bold text-gray-400 uppercase tracking-widest">备份与恢复</span></div>
            <div class="flex gap-2 mb-3">
                <button onclick="exportChatHistory()" class="w-1/2 bg-blue-50 text-blue-600 py-2.5 rounded-xl font-bold hover:bg-blue-100 text-sm transition"><i class="fa-solid fa-file-export mr-1"></i> 导出记录</button>
                <button onclick="document.getElementById('history-import-upload').click()" class="w-1/2 bg-green-50 text-green-600 py-2.5 rounded-xl font-bold hover:bg-green-100 text-sm transition"><i class="fa-solid fa-file-import mr-1"></i> 导入记录</button>
            </div>
            <input type="file" id="history-import-upload" accept=".json" class="hidden" onchange="importChatHistory(this)">

            <button onclick="deleteAccount()" class="w-full bg-red-50 text-red-500 py-2.5 rounded-xl font-bold hover:bg-red-100 text-sm transition">🚨 永久注销我的账号</button>
            <button onclick="hideModal('profile-modal')" class="w-full mt-4 text-sm text-gray-400">关闭</button>
        </div>
    </div>

    <!-- 添加好友 Modal -->
    <div id="search-friends-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-50 backdrop-blur-sm p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl relative overflow-hidden">
            <h2 class="text-xl font-bold text-center mb-4"><i class="fa-solid fa-user-plus text-blue-500 mr-2"></i>添加好友</h2>
            
            <!-- Tab: 搜索 / 我的二维码 / 扫码 -->
            <div class="flex justify-center space-x-4 border-b mb-4 pb-2">
                <button id="friend-tab-search" onclick="switchFriendTab('search')" class="font-bold text-blue-600 border-b-2 border-blue-600 pb-1 px-1 transition text-xs">搜索用户</button>
                <button id="friend-tab-my-qr" onclick="switchFriendTab('my-qr')" class="font-bold text-gray-400 hover:text-gray-600 pb-1 px-1 transition text-xs">我的二维码</button>
                <button id="friend-tab-scan" onclick="switchFriendTab('scan')" class="font-bold text-gray-400 hover:text-gray-600 pb-1 px-1 transition text-xs">扫码加好友</button>
            </div>

            <!-- 搜索容器 -->
            <div id="friend-search-container" class="space-y-4">
                <div class="flex gap-2">
                    <input id="friend-search-input" type="text" placeholder="输入用户名或昵称" class="flex-1 px-4 py-2.5 bg-gray-100 rounded-xl outline-none text-sm">
                    <button onclick="performFriendSearch()" class="bg-blue-600 text-white px-4 py-2.5 rounded-xl font-bold hover:bg-blue-700 text-sm shadow-md shadow-blue-500/20 transition">搜索</button>
                </div>
                
                <!-- 搜索结果列表 -->
                <div id="friend-search-results" class="max-h-60 overflow-y-auto space-y-2 pr-1 no-scrollbar">
                    <div class="text-center py-6 text-gray-400 text-xs">输入关键词并搜索</div>
                </div>
            </div>

            <!-- 我的二维码容器 -->
            <div id="my-friend-qr-container" class="hidden flex flex-col items-center justify-center py-4">
                <div id="my-friend-qr-box" class="w-48 h-48 bg-white flex items-center justify-center p-2 border rounded-2xl shadow-sm overflow-hidden">
                    <!-- 二维码 -->
                </div>
                <div class="text-xs text-gray-500 mt-4 text-center">让对方使用客户端扫描此码加好友</div>
            </div>

            <!-- 扫码容器 -->
            <div id="friend-scan-container" class="hidden flex flex-col items-center justify-center py-4 space-y-4">
                <div id="qr-reader" class="w-full max-w-[240px] h-[240px] bg-black rounded-2xl overflow-hidden relative border border-gray-200">
                    <div id="qr-reader-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 p-4 text-center space-y-3">
                        <i class="fa-solid fa-camera text-3xl"></i>
                        <span class="text-[10px]">开启摄像头扫描，或上传二维码图片</span>
                        <button onclick="startCameraScan()" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-blue-700 transition">开启摄像头</button>
                    </div>
                </div>
                
                <div class="flex gap-2 w-full justify-center">
                    <button id="btn-stop-scan" onclick="stopCameraScan()" class="hidden bg-red-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-red-600 transition">关闭摄像头</button>
                    <button onclick="document.getElementById('qr-file-input').click()" class="bg-gray-100 text-gray-700 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-gray-200 transition">
                        <i class="fa-solid fa-image mr-1"></i> 选择图片
                    </button>
                </div>
                <input type="file" id="qr-file-input" accept="image/*" class="hidden" onchange="scanQrFile(this)">
            </div>

            <button onclick="hideModal('search-friends-modal')" class="w-full mt-4 text-sm text-gray-400 hover:text-gray-600">关闭</button>
        </div>
    </div>

    <!-- 好友申请 Modal -->
    <div id="friend-requests-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-50 backdrop-blur-sm p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl">
            <h2 class="text-xl font-bold text-center mb-4"><i class="fa-solid fa-bell text-blue-500 mr-2"></i>好友申请</h2>
            <div id="friend-requests-list" class="max-h-80 overflow-y-auto space-y-3 no-scrollbar">
                <div class="text-center py-8 text-gray-400 text-xs">暂无好友申请</div>
            </div>
            <button onclick="hideModal('friend-requests-modal')" class="w-full mt-4 text-sm text-gray-400 hover:text-gray-600">关闭</button>
        </div>
    </div>

    <div id="create-group-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-50 backdrop-blur-sm p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-8 shadow-2xl">
            <h2 class="text-2xl font-bold text-center mb-6"><i class="fa-solid fa-users text-blue-500 mr-2"></i>新建群聊</h2>
            <input id="new-group-name" type="text" placeholder="给群聊起个名字" class="w-full mb-6 px-5 py-3.5 bg-gray-100 rounded-xl outline-none">
            <button onclick="submitCreateGroup()" class="w-full bg-blue-600 text-white py-3.5 rounded-2xl font-bold hover:bg-blue-700">确认创建</button>
            <button onclick="hideModal('create-group-modal')" class="w-full mt-4 text-sm text-gray-400">取消</button>
        </div>
    </div>

    <div id="manage-group-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-50 backdrop-blur-sm p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto no-scrollbar">
            <h2 class="text-2xl font-bold text-center mb-4">⚙️ 群聊设置</h2>
            <div class="flex flex-col items-center mb-4">
                <div class="relative w-20 h-20 mb-2 group cursor-pointer" onclick="document.getElementById('group-avatar-upload').click()">
                    <div id="group-avatar-preview" class="w-20 h-20 rounded-full flex items-center justify-center text-2xl font-bold text-white shadow-lg overflow-hidden avatar-gradient border-4 border-white"></div>
                    <div class="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-camera text-white text-lg"></i></div>
                </div>
                <input type="file" id="group-avatar-upload" accept="image/*" class="hidden" onchange="processGroupAvatar(this)">
            </div>
            
            <label class="text-xs font-bold text-gray-500 mb-1 block">群名称</label>
            <input id="edit-group-name" type="text" class="w-full mb-4 px-4 py-2.5 bg-gray-100 rounded-xl outline-none">
            
            <div class="border-t border-gray-100 pt-3 mb-4">
                <label class="text-xs font-bold text-gray-500 mb-2 block uppercase tracking-wider">🔒 权限管理 (多个用户名用逗号分隔)</label>
                
                <div class="flex items-center justify-between mb-1">
                    <label class="text-xs text-gray-600 font-bold">查看权限</label>
                    <select id="group-view-mode" class="bg-gray-100 text-xs px-2 py-1 rounded outline-none" onchange="togglePermViews()">
                        <option value="0">公开 (指定黑名单禁看)</option>
                        <option value="1">私密 (仅白名单可看)</option>
                    </select>
                </div>
                <input id="group-black-view" type="text" placeholder="禁止查看的用户名" class="w-full mb-2 px-3 py-2 bg-gray-50 rounded-lg text-sm outline-none border">
                <input id="group-white-view" type="text" placeholder="允许查看的用户名" class="w-full mb-2 px-3 py-2 bg-gray-50 rounded-lg text-sm outline-none border hidden">
                
                <div class="flex items-center justify-between mb-1 mt-2">
                    <label class="text-xs text-gray-600 font-bold">发言权限</label>
                    <select id="group-speak-mode" class="bg-gray-100 text-xs px-2 py-1 rounded outline-none" onchange="togglePermViews()">
                        <option value="0">全员 (指定黑名单禁言)</option>
                        <option value="1">禁言 (仅白名单发言)</option>
                    </select>
                </div>
                <input id="group-black-speak" type="text" placeholder="禁止发言的用户名" class="w-full mb-2 px-3 py-2 bg-gray-50 rounded-lg text-sm outline-none border">
                <input id="group-white-speak" type="text" placeholder="允许发言的用户名" class="w-full mb-2 px-3 py-2 bg-gray-50 rounded-lg text-sm outline-none border hidden">
            </div>

            <button onclick="submitEditGroup()" class="w-full bg-blue-600 text-white py-3 rounded-2xl font-bold hover:bg-blue-700 mb-2">保存修改</button>
            <button onclick="submitDeleteGroup()" class="w-full bg-red-50 text-red-600 py-3 rounded-2xl font-bold hover:bg-red-100 transition">🚨 彻底解散该群</button>
            <button onclick="hideModal('manage-group-modal')" class="w-full mt-3 text-sm text-gray-400">取消</button>
        </div>
    </div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('user') || 'null');
        let currentRoomId = 0; let currentTargetUser = null; 
        let pendingAvatarBase64 = null; let pendingGroupAvatarBase64 = null; 
        let globalGroups = []; let authMode = 'login'; let globalBlockedUsers = [];
        let ws = null; let onlineUsers = []; let typingTimer = null;

        function getAvatarHtml(avatarStr, name, sizeClass = "w-10 h-10 text-base") {
            const displayName = name || "?";
            if (avatarStr && avatarStr.startsWith('data:image')) {
                return `<img src="${avatarStr}" class="${sizeClass} rounded-full object-cover shadow-sm">`;
            } else {
                return `<div class="${sizeClass} rounded-full flex items-center justify-center text-white font-bold shadow-sm avatar-gradient">${displayName.charAt(0).toUpperCase()}</div>`;
            }
        }

        function init() {
            if (currentUser) {
                document.getElementById('btn-settings').style.display = 'block';
                const name = currentUser.nickname || currentUser.username;
                document.getElementById('user-info').innerHTML = `
                    <div class="flex items-center overflow-hidden">
                        ${getAvatarHtml(currentUser.avatar, name, "w-9 h-9 text-sm mr-3")}
                        <div class="truncate">
                            <div class="text-sm font-bold truncate">${name}</div>
                            <button onclick="logout()" class="text-[10px] text-red-400 hover:underline">退出登录</button>
                        </div>
                    </div>
                `;
                loadUsers(); 
                setupWebSocket();
                loadFavoriteEmojis();
                checkPendingFriendRequests();
            }
            loadGroups().then(() => switchRoom(0, '公共大厅'));
            if (currentUser) {
                loadNotices(); setInterval(loadNotices, 30000); // 降低系统公告请求频率
            }
        }

        function setupWebSocket() {
            if (!currentUser) return;
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/${currentUser.token}`);
            
            ws.onopen = () => {
                const statusDot = document.getElementById('status-dot');
                const statusText = document.getElementById('status-text');
                statusDot.className = "w-1.5 h-1.5 bg-green-500 rounded-full mr-1.5 animate-pulse";
                statusText.innerText = "在线";
                statusText.className = "text-green-500";
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'message') {
                    handleNewMessage(msg.data);
                } else if (msg.type === 'online_status') {
                    onlineUsers = msg.users;
                    updateOnlineDisplay();
                } else if (msg.type === 'typing') {
                    handleTyping(msg);
                } else if (msg.type === 'recall') {
                    handleRecall(msg.msg_id);
                } else if (msg.type === 'friend_request') {
                    showToast(`收到来自 ${msg.from_nickname || msg.from_user} 的好友申请！`);
                    document.getElementById('friend-req-badge').classList.remove('hidden');
                    if (window.desktopNotify) {
                        window.desktopNotify(
                            "好友申请",
                            `收到来自 ${msg.from_nickname || msg.from_user} (@${msg.from_user}) 的好友申请！`,
                            "-1",
                            msg.from_user,
                            msg.from_nickname || "",
                            msg.from_avatar || ""
                        );
                    }
                } else if (msg.type === 'friend_accepted') {
                    showToast(`${msg.by_nickname || msg.by_user} 已同意您的好友申请，你们现在是好友了！`);
                    loadUsers();
                    if (window.desktopNotify) {
                        window.desktopNotify(
                            "好友申请已通过",
                            `${msg.by_nickname || msg.by_user} (@${msg.by_user}) 已同意您的好友申请，你们现在是好友了！`,
                            "-1",
                            msg.by_user,
                            msg.by_nickname || "",
                            msg.by_avatar || ""
                        );
                    }
                }
            };

            ws.onclose = () => {
                const statusDot = document.getElementById('status-dot');
                const statusText = document.getElementById('status-text');
                statusDot.className = "w-1.5 h-1.5 bg-gray-400 rounded-full mr-1.5";
                statusText.innerText = "已断开 (重连中...)";
                statusText.className = "text-gray-400";
                setTimeout(setupWebSocket, 3000);
            };
        }

        function handleNewMessage(data) {
            // 如果消息属于当前房间或当前私信对象，则追加到页面
            const isCurrentRoom = !data.receiver && data.room_id === currentRoomId;
            const isCurrentPrivate = data.receiver && (
                (data.name === currentTargetUser && data.receiver === currentUser.username) ||
                (data.name === currentUser.username && data.receiver === currentTargetUser)
            );

            if (isCurrentRoom || isCurrentPrivate) {
                if (globalBlockedUsers.includes(data.name)) return;
                appendMessage(data);
            }
            // 收到新消息时，如果是其他房间的消息，可以加一个小红点逻辑（暂未实现）
        }

        window.openChatFromNotification = function(roomId, senderUsername, senderNickname, senderAvatar) {
            console.log("openChatFromNotification triggered:", roomId, senderUsername, senderNickname, senderAvatar);
            if (roomId !== undefined && roomId !== null && roomId !== "" && roomId !== "-1" && roomId !== -1) {
                const id = parseInt(roomId);
                const group = globalGroups.find(g => g.id === id);
                const name = group ? group.name : (id === 0 ? "公共大厅" : "群聊");
                switchRoom(id, name);
            } else if (senderUsername) {
                switchPrivateChat(senderUsername, senderNickname || senderUsername, senderAvatar || "");
            }
        };

        function handleTyping(msg) {
            const isRelevant = (msg.room_id === currentRoomId && !msg.receiver) || (msg.receiver === currentUser.username && msg.user === currentTargetUser);
            if (isRelevant && msg.user !== currentUser.username) {
                const indicator = document.getElementById('typing-indicator');
                indicator.innerText = `${msg.user} 正在输入...`;
                indicator.classList.remove('hidden');
                clearTimeout(typingTimer);
                typingTimer = setTimeout(() => indicator.classList.add('hidden'), 3000);
            }
        }

        function handleRecall(msgId) {
            const msgElement = document.querySelector(`[data-msg-id="${msgId}"]`);
            if (msgElement) {
                loadMsgs(); // 简单处理：直接重新加载当前列表
            }
        }

        function updateOnlineDisplay() {
            // 更新用户列表中的在线状态
            document.querySelectorAll('[id^="user-btn-"]').forEach(btn => {
                const username = btn.id.replace('user-btn-', '');
                const dot = btn.querySelector('.online-dot');
                if (onlineUsers.includes(username)) {
                    if (!dot) {
                        const newDot = document.createElement('div');
                        newDot.className = "online-dot w-2 h-2 bg-green-500 rounded-full absolute -bottom-0.5 -right-0.5 border border-gray-900";
                        btn.querySelector('.relative-container').appendChild(newDot);
                    }
                } else if (dot) {
                    dot.remove();
                }
            });
        }

        function hideModal(id) { document.getElementById(id).classList.add('hidden'); }
        function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function showLogin() { switchAuthTab('login'); showModal('login-modal'); }

        function checkGroupOwnership(id) {
            const btn = document.getElementById('room-manage-btn');
            if (id === 0 || !currentUser) { btn.classList.add('hidden'); return; }
            const group = globalGroups.find(g => g.id === id);
            if (group && (group.owner_id === currentUser.id || currentUser.role === 1)) {
                btn.classList.remove('hidden');
            } else { btn.classList.add('hidden'); }
        }

        function switchRoom(id, name) {
            currentRoomId = id; currentTargetUser = null;
            document.getElementById('room-title').innerText = name;
            const blockBtn = document.getElementById('user-block-btn');
            if(blockBtn) blockBtn.classList.add('hidden');
            
            const group = globalGroups.find(g => g.id === id);
            const isFrozen = group && group.is_frozen === 1;
            const msgInput = document.getElementById('msg-input');
            const sendBtn = document.getElementById('send-btn');
            
            if (isFrozen) {
                msgInput.disabled = true; msgInput.placeholder = "❌ 此群聊已被管理员冻结，全员禁言";
                sendBtn.disabled = true; sendBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                msgInput.disabled = false; msgInput.placeholder = "说点什么吧... (Enter发送)";
                sendBtn.disabled = false; sendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
            
            // 【修改点】顶部标题栏：如果是公共大厅，强制显示官方图标
            const avatarHtml = id === 0 
                ? `<img src="/favicon.ico" class="w-full h-full rounded-full object-cover shadow-sm">` 
                : (group ? getAvatarHtml(group.avatar, name, "w-full h-full text-xl") : '<i class="fa-solid fa-hashtag text-xl"></i>');
            document.getElementById('header-icon').innerHTML = avatarHtml;

            updateActiveBtn(`room-btn-${id}`); checkGroupOwnership(id); loadMsgs();
        }

        function switchPrivateChat(username, displayName, avatar) {
            currentRoomId = -1; currentTargetUser = username;
            document.getElementById('room-title').innerText = `与 ${displayName} 私信`;
            document.getElementById('header-icon').innerHTML = getAvatarHtml(avatar, displayName, "w-full h-full text-lg");
            
            const msgInput = document.getElementById('msg-input');
            const sendBtn = document.getElementById('send-btn');
            msgInput.disabled = false; msgInput.placeholder = "发送私信...";
            sendBtn.disabled = false; sendBtn.classList.remove('opacity-50', 'cursor-not-allowed');

            updateActiveBtn(`user-btn-${username}`);
            document.getElementById('room-manage-btn').classList.add('hidden'); 
            
            const blockBtn = document.getElementById('user-block-btn');
            blockBtn.classList.remove('hidden');
            
            loadMsgs();
        }

        function updateActiveBtn(btnId) {
            document.querySelectorAll('.room-btn').forEach(b => { b.classList.remove('bg-gray-800', 'text-white'); b.classList.add('text-gray-300'); });
            const act = document.getElementById(btnId);
            if(act) { act.classList.add('bg-gray-800', 'text-white'); act.classList.remove('text-gray-300'); }
        }

        async function loadGroups() {
            const res = await fetch('/api/groups'); globalGroups = (await res.json()).data;
            const list = document.getElementById('channel-list'); list.innerHTML = '';
            globalGroups.forEach(g => {
                const btn = document.createElement('button'); btn.id = `room-btn-${g.id}`;
                btn.className = "room-btn w-full text-left px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-800 transition flex items-center";
                const isMine = currentUser && g.owner_id === currentUser.id && g.id !== 0;
                
                // 【修改点】左侧列表：如果是公共大厅，强制显示官方图标
                const groupAvatarHtml = g.id === 0 
                    ? `<img src="/favicon.ico" class="w-6 h-6 rounded-full object-cover shadow-sm shrink-0 mr-3">` 
                    : getAvatarHtml(g.avatar, g.name, "w-6 h-6 text-[10px] shrink-0 mr-3");
                    
                btn.innerHTML = `${groupAvatarHtml}<span class="flex-1 truncate">${g.name}</span>${isMine ? '<i class="fa-solid fa-crown text-[10px] text-yellow-500"></i>' : ''}`;
                btn.onclick = () => switchRoom(g.id, g.name);
                list.appendChild(btn);
            });
        }

        function showCreateGroup() { if(!currentUser) return showLogin(); document.getElementById('new-group-name').value = ''; showModal('create-group-modal'); }
        async function submitCreateGroup() {
            const name = document.getElementById('new-group-name').value.trim(); if(!name) return;
            const res = await fetch('/api/groups', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': currentUser.token }, body: JSON.stringify({ name: name, is_public: 1 }) });
            if(res.ok) { hideModal('create-group-modal'); await loadGroups(); switchRoom((await res.json()).group_id, name); } else alert("创建失败");
        }

        function togglePermViews() {
            const vm = document.getElementById('group-view-mode').value;
            const sm = document.getElementById('group-speak-mode').value;
            document.getElementById('group-black-view').classList.toggle('hidden', vm === '1');
            document.getElementById('group-white-view').classList.toggle('hidden', vm === '0');
            document.getElementById('group-black-speak').classList.toggle('hidden', sm === '1');
            document.getElementById('group-white-speak').classList.toggle('hidden', sm === '0');
        }

        function showManageGroup() {
            const group = globalGroups.find(g => g.id === currentRoomId); if(!group) return;
            document.getElementById('edit-group-name').value = group.name;
            
            document.getElementById('group-view-mode').value = group.view_mode || 0;
            document.getElementById('group-speak-mode').value = group.speak_mode || 0;
            document.getElementById('group-black-view').value = group.black_view || '';
            document.getElementById('group-white-view').value = group.white_view || '';
            document.getElementById('group-black-speak').value = group.black_speak || '';
            document.getElementById('group-white-speak').value = group.white_speak || '';
            togglePermViews();
            
            pendingGroupAvatarBase64 = group.avatar;
            document.getElementById('group-avatar-preview').innerHTML = getAvatarHtml(group.avatar, group.name, "w-full h-full text-2xl");
            showModal('manage-group-modal');
        }

        async function submitEditGroup() {
            const name = document.getElementById('edit-group-name').value.trim(); if(!name) return;
            
            const vm = document.getElementById('group-view-mode').value;
            const sm = document.getElementById('group-speak-mode').value;
            const bv = document.getElementById('group-black-view').value.trim();
            const wv = document.getElementById('group-white-view').value.trim();
            const bs = document.getElementById('group-black-speak').value.trim();
            const ws = document.getElementById('group-white-speak').value.trim();
            
            const res = await fetch(`/api/groups/${currentRoomId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': currentUser.token }, body: JSON.stringify({ name: name }) });
            if(res.ok) { 
                await fetch(`/api/groups/${currentRoomId}/permissions`, { 
                    method: 'PUT', 
                    headers: { 'Content-Type': 'application/json', 'Authorization': currentUser.token }, 
                    body: JSON.stringify({ view_mode: parseInt(vm), speak_mode: parseInt(sm), black_view: bv, white_view: wv, black_speak: bs, white_speak: ws }) 
                });
                
                const group = globalGroups.find(g => g.id === currentRoomId);
                if (pendingGroupAvatarBase64 !== group.avatar) {
                    await fetch(`/api/groups/${currentRoomId}/avatar`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': currentUser.token }, body: JSON.stringify({ avatar: pendingGroupAvatarBase64 || "" }) });
                }
                hideModal('manage-group-modal'); await loadGroups(); switchRoom(currentRoomId, name); 
            } else {
                alert("修改群聊失败，可能无权限");
            }
        }
        async function submitDeleteGroup() {
            if(!confirm("🚨 警告：解散群聊将永久删除历史记录！")) return;
            const res = await fetch(`/api/groups/${currentRoomId}`, { method: 'DELETE', headers: { 'Authorization': currentUser.token } });
            if(res.ok) { hideModal('manage-group-modal'); await loadGroups(); switchRoom(0, '公共大厅'); }
        }

        function processGroupAvatar(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                        const maxSize = 150; let size = Math.min(img.width, img.height);
                        canvas.width = maxSize; canvas.height = maxSize;
                        ctx.drawImage(img, (img.width - size)/2, (img.height - size)/2, size, size, 0, 0, maxSize, maxSize);
                        pendingGroupAvatarBase64 = canvas.toDataURL('image/jpeg', 0.8);
                        document.getElementById('group-avatar-preview').innerHTML = getAvatarHtml(pendingGroupAvatarBase64, "", "w-full h-full");
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function loadUsers() {
            // First fetch users blocklist
            try {
                const blockRes = await fetch('/api/users', { headers: { 'Authorization': currentUser.token } });
                const blockResult = await blockRes.json();
                if(blockResult.status === 'success') {
                    globalBlockedUsers = blockResult.blocked_users || [];
                }
            } catch(e) { console.error(e); }
            
            // Then fetch only friends
            const res = await fetch('/api/friends', { headers: { 'Authorization': currentUser.token } });
            const result = await res.json(); if(result.status !== 'success') return;
            const list = document.getElementById('user-list'); list.innerHTML = '';
            if(result.data.length === 0) {
                list.innerHTML = '<div class="text-gray-500 text-xs px-2 italic py-2 text-center">暂无好友，点击右上角搜索添加</div>';
                return;
            }
            result.data.forEach(u => {
                if(u.username === currentUser.username) return;
                const name = u.nickname || u.username;
                const btn = document.createElement('button'); btn.id = `user-btn-${u.username}`;
                const blockIcon = globalBlockedUsers.includes(u.username) ? '<i class="fa-solid fa-ban text-red-500 ml-auto text-xs"></i>' : '';
                btn.className = "room-btn w-full text-left p-2 rounded-lg text-gray-300 hover:bg-gray-800 transition flex items-center gap-3";
                btn.innerHTML = `
                    <div class="relative relative-container">
                        ${getAvatarHtml(u.avatar, name, "w-6 h-6 text-[10px] shrink-0")}
                        ${onlineUsers.includes(u.username) ? '<div class="online-dot w-2 h-2 bg-green-500 rounded-full absolute -bottom-0.5 -right-0.5 border border-gray-900"></div>' : ''}
                    </div>
                    <span class="truncate text-sm flex-1">${name}</span>${blockIcon}
                `;
                btn.onclick = () => switchPrivateChat(u.username, name, u.avatar);
                list.appendChild(btn);
            });
        }

        async function confirmDeleteFriend() {
            if(!currentUser || !currentTargetUser) return;
            if(!confirm(`确定要删除好友 @${currentTargetUser} 吗？删除后双方将无法发送私信。`)) return;
            
            try {
                const res = await fetch(`/api/friends/${currentTargetUser}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': currentUser.token }
                });
                const result = await res.json();
                if(res.ok) {
                    showToast(result.msg || "删除好友成功");
                    // Clear current chat
                    currentTargetUser = null;
                    document.getElementById('messages').innerHTML = '';
                    document.getElementById('header-icon').innerHTML = '<i class="fa-solid fa-hashtag text-xl"></i>';
                    document.getElementById('room-title').innerText = '公共大厅';
                    document.getElementById('user-block-btn').classList.add('hidden');
                    document.getElementById('room-manage-btn').classList.add('hidden');
                    
                    // Reset input area
                    const inputArea = document.getElementById('message-input');
                    const sendBtn = document.getElementById('send-btn');
                    inputArea.placeholder = "请选择左侧会话或群聊开始聊天...";
                    inputArea.value = '';
                    inputArea.disabled = true;
                    sendBtn.disabled = true;
                    sendBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    
                    // Reload friend list
                    loadUsers();
                } else {
                    alert(result.detail || "操作失败");
                }
            } catch(e) {
                console.error(e);
                alert("操作失败");
            }
        }

        function startPolling() {
            // 已废弃，改用 WebSocket
        }

        function appendMessage(msg) {
            const list = document.getElementById('msg-list');
            const noMsg = list.querySelector('.text-center.py-20');
            if (noMsg) noMsg.remove();
            
            const isMe = currentUser && (msg.name === currentUser.username);
            const name = msg.nickname || msg.name;
            const div = document.createElement('div');
            div.setAttribute('data-msg-id', msg.id);
            div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} msg-appear mb-4`;
            
            div.innerHTML = `
                ${!isMe ? `<div class="mr-2 mt-1 shrink-0">${getAvatarHtml(msg.avatar, name, "w-8 h-8 text-xs")}</div>` : ''}
                <div class="max-w-[80%] sm:max-w-[70%] flex flex-col ${isMe ? 'items-end' : 'items-start'} group">
                    ${!isMe ? `<div class="text-[10px] text-gray-400 mb-1 ml-1">${name}</div>` : ''}
                    <div class="${isMe ? 'bg-blue-600 text-white rounded-2xl rounded-tr-none' : 'bg-white text-gray-800 rounded-2xl rounded-tl-none border border-gray-100 shadow-sm'} p-3 px-4 text-sm break-words leading-relaxed">${renderContent(msg.content)}</div>
                    <div class="text-[10px] text-gray-300 mt-1 ${isMe ? 'mr-1' : 'ml-1'} flex items-center gap-2">
                        刚刚
                        ${isMe ? `<button onclick="recallMsg(${msg.id})" class="text-red-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity focus:opacity-100">撤回</button>` : ''}
                    </div>
                </div>
                ${isMe ? `<div class="ml-2 mt-1 shrink-0">${getAvatarHtml(msg.avatar, name, "w-8 h-8 text-xs")}</div>` : ''}
            `;
            list.appendChild(div);
            list.scrollTop = list.scrollHeight;
        }

        function renderContent(content) {
            let safe = content.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            safe = safe.replace(/\[img:([^\]]+)\]/g, '<img src="$1" class="max-w-[200px] sm:max-w-xs mt-1 rounded-lg cursor-pointer hover:opacity-90 transition" onclick="window.open(\'$1\')">');
            safe = safe.replace(/\[file:([^|]+)\|([^\]]+)\]/g, '<a href="$1" target="_blank" class="flex items-center mt-1 p-2 bg-black/10 rounded-lg hover:bg-black/20 transition underline break-all"><i class="fa-solid fa-file-arrow-down mr-2 shrink-0"></i>$2</a>');
            return safe.replace(/\n/g, '<br>');
        }

                    const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp'].includes(ext);
                    let fileMarkdown = "";
                    if (isImage) {

                    const body = { content: fileMarkdown, room_id: currentRoomId };

        async function startQrLoginFlow() {
            const qrBox = document.getElementById('qr-code-box');
            const qrMsg = document.getElementById('qr-status-msg');
            qrBox.innerHTML = '<div class="text-xs text-gray-400">正在生成二维码...</div>';
            qrMsg.innerText = "使用手机客户端扫码登录";

            try {
                const response = await fetch('/api/qr/generate');
                const res = await response.json();
                if (res.code === 200) {
                    const qrId = res.qr_id;
                    qrBox.innerHTML = '';
                    
                    qrCodeObj = new QRCode(qrBox, {
                        text: `openboard:qr_login:${qrId}`,
                        width: 170,
                        height: 170,
                        colorDark : "#1f2937",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });

                    let attempts = 0;
                    qrPollInterval = setInterval(async () => {
                        attempts++;
                        if (attempts > 80) {
                            clearInterval(qrPollInterval);
                            qrBox.innerHTML = '<div class="text-xs text-red-500 font-bold cursor-pointer" onclick="startQrLoginFlow()">二维码已失效<br>点击重新获取</div>';
                            qrMsg.innerText = "";
                            return;
                        }
                        
                        try {
                            const statusResp = await fetch(`/api/qr/status?qr_id=${qrId}`);
                            const statusRes = await statusResp.json();
                            
                            if (statusRes.status === 'scanned') {
                                qrMsg.innerText = "📱 已扫描，请在手机上确认登录...";
                            } else if (statusRes.status === 'authorized') {
                                clearInterval(qrPollInterval);
                                showToast("登录成功，正在进入...");
                                // Construct complete AuthResponse mapping
                                const userObj = {
                                    code: 200,
                                    token: statusRes.token,
                                    username: statusRes.user.username,
                                    nickname: statusRes.user.nickname,
                                    avatar: statusRes.user.avatar,
                                    id: statusRes.user.id,
                                    role: statusRes.user.role
                                };
                                localStorage.setItem('user', JSON.stringify(userObj));
                                document.cookie = `token=${statusRes.token}; max-age=${3600*24*7}; path=/`;
                                location.reload();
                            }
                        } catch (e) {
                            console.error("Error polling QR status:", e);
                        }
                    }, 1500);
                } else {
                    qrBox.innerHTML = '<div class="text-xs text-red-500 cursor-pointer" onclick="startQrLoginFlow()">生成失败，点击重试</div>';
                }
            } catch (e) {
                qrBox.innerHTML = '<div class="text-xs text-red-500 cursor-pointer" onclick="startQrLoginFlow()">网络错误，点击重试</div>';
            }
        }

        function processAvatar(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                        const maxSize = 150; let size = Math.min(img.width, img.height);
                        canvas.width = maxSize; canvas.height = maxSize;
                        ctx.drawImage(img, (img.width - size)/2, (img.height - size)/2, size, size, 0, 0, maxSize, maxSize);
                        pendingAvatarBase64 = canvas.toDataURL('image/jpeg', 0.8);
                        document.getElementById('profile-avatar-preview').innerHTML = getAvatarHtml(pendingAvatarBase64, "", "w-full h-full");
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

            const res = await fetch('/api/user/password', {
                method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': currentUser.token },
                body: JSON.stringify({ old_password: oldP, new_password: newP })
            });
            const data = await res.json();
            if(res.ok) { alert("✅ " + data.msg); logout(); } else { alert("❌ " + data.detail); }
        }

        async function deleteAccount() {
            if(!confirm("🚨 最终警告：\n你确定要永久注销你的账号吗？\n你的所有聊天记录、创建的群聊将会被永远抹除！此操作不可逆！")) return;
            const res = await fetch('/api/user/account', { method: 'DELETE', headers: { 'Authorization': currentUser.token } });
            if(res.ok) { alert("👋 账号已成功注销。再见！"); logout(); } 
            else { const err = await res.json(); alert("注销失败: " + err.detail); }
        }

        async function exportChatHistory() {
            try {
                const res = await fetch('/api/messages/export', {
                    headers: { 'Authorization': currentUser.token }
                });
                if (!res.ok) {
                    const err = await res.json();
                    alert("导出失败: " + (err.detail || "未知错误"));
                    return;
                }
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `openboard_chat_history_${currentUser.username}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            } catch (err) {
                alert("导出异常: " + err.message);
            }
        }

        async function importChatHistory(input) {
            const file = input.files[0];
            if (!file) return;
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const res = await fetch('/api/messages/import', {
                    method: 'POST',
                    headers: { 'Authorization': currentUser.token },
                    body: formData
                });
                const data = await res.json();
                if (res.ok) {
                    alert(`✅ 导入成功！共导入/恢复了 ${data.imported_count} 条聊天记录。`);
                    location.reload();
                } else {
                    alert("❌ 导入失败: " + (data.detail || "格式错误或数据无效"));
                }
            } catch (err) {
                alert("导入异常: " + err.message);
            } finally {
                input.value = '';
            }
        }

        // --- 自定义右键/长按上下文菜单逻辑 ---
        let currentMenuImage = null;
        const msgList = document.getElementById('msg-list');
        const customMenu = document.getElementById('custom-context-menu');

        function showContextMenu(x, y, imageUrl) {
            currentMenuImage = imageUrl;
            customMenu.classList.remove('hidden');
            
            const menuWidth = 140;
            const menuHeight = 110;
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            
            let posX = x;
            let posY = y;
            
            if (x + menuWidth > screenWidth) {
                posX = screenWidth - menuWidth - 10;
            }
            if (y + menuHeight > screenHeight) {
                posY = screenHeight - menuHeight - 10;
            }
            
            customMenu.style.left = `${posX}px`;
            customMenu.style.top = `${posY}px`;
            
            setTimeout(() => {
                customMenu.style.opacity = '1';
                customMenu.style.transform = 'scale(1)';
            }, 10);
        }

        function hideContextMenu() {
            customMenu.style.opacity = '0';
            customMenu.style.transform = 'scale(0.95)';
            setTimeout(() => {
                customMenu.classList.add('hidden');
            }, 150);
        }

        document.getElementById('menu-btn-favorite').onclick = (e) => {
            e.stopPropagation();
            if (currentMenuImage) {
                toggleFavoriteEmoji(`[img:${currentMenuImage}]`);
            }
            hideContextMenu();
        };

        document.getElementById('menu-btn-download').onclick = (e) => {
            e.stopPropagation();
            if (currentMenuImage) {
                if (currentMenuImage.startsWith('data:')) {
                    const a = document.createElement('a');
                    a.href = currentMenuImage;
                    a.download = 'expression.jpg';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                } else {
                    window.open(currentMenuImage, '_blank');
                }
            }
            hideContextMenu();
        };

        document.getElementById('menu-btn-copy-link').onclick = (e) => {
            e.stopPropagation();
            if (currentMenuImage) {
                let absoluteUrl = currentMenuImage;
                if (!currentMenuImage.startsWith('http') && !currentMenuImage.startsWith('data:')) {
                    absoluteUrl = window.location.origin + (currentMenuImage.startsWith('/') ? '' : '/') + currentMenuImage;
                }
                navigator.clipboard.writeText(absoluteUrl).then(() => {
                    showToast("链接已复制到剪贴板");
                }).catch(err => {
                    const input = document.createElement('input');
                    input.value = absoluteUrl;
                    document.body.appendChild(input);
                    input.select();
                    document.execCommand('copy');
                    document.body.removeChild(input);
                    showToast("链接已复制到剪贴板");
                });
            }
            hideContextMenu();
        };

        // 隐藏菜单
        document.addEventListener('click', (e) => {
            if (!customMenu.contains(e.target)) {
                hideContextMenu();
            }
        });

        // 桌面端右键
        msgList.addEventListener('contextmenu', e => {
            const target = e.target;
            if (target && target.tagName === 'IMG' && target.src) {
                if (target.classList.contains('rounded-full') || target.closest('.w-8.h-8')) {
                    return; 
                }
                e.preventDefault();
                const src = target.getAttribute('src');
                showContextMenu(e.clientX, e.clientY, src);
            }
        });

        // 移动端长按
        let msgImageTouchTimer = null;
        let touchX = 0;
        let touchY = 0;
        msgList.addEventListener('touchstart', e => {
            const target = e.target;
            if (target && target.tagName === 'IMG' && target.src) {
                if (target.classList.contains('rounded-full') || target.closest('.w-8.h-8')) {
                    return;
                }
                const touch = e.touches[0];
                touchX = touch.clientX;
                touchY = touch.clientY;
                if (msgImageTouchTimer) clearTimeout(msgImageTouchTimer);
                msgImageTouchTimer = setTimeout(() => {
                    const src = target.getAttribute('src');
                    if (navigator.vibrate) navigator.vibrate(50);
                    showContextMenu(touchX, touchY, src);
                    msgImageTouchTimer = null;
                }, 800); 
            }
        }, { passive: true });

        msgList.addEventListener('touchend', () => {
            if (msgImageTouchTimer) {
                clearTimeout(msgImageTouchTimer);
                msgImageTouchTimer = null;
            }
        });

        msgList.addEventListener('touchmove', () => {
            if (msgImageTouchTimer) {
                clearTimeout(msgImageTouchTimer);
                msgImageTouchTimer = null;
            }
        });

        // --- 好友系统相关交互逻辑 ---
        let currentFriendTab = 'search';
        let html5QrcodeScanner = null;

        function showSearchFriendsModal() {
            showModal('search-friends-modal');
            switchFriendTab('search');
            document.getElementById('friend-search-input').value = '';
            document.getElementById('friend-search-results').innerHTML = '<div class="text-center py-6 text-gray-400 text-xs">输入关键词并搜索</div>';
            
            // Camera scanner cleanup just in case
            stopCameraScan();
        }

        function switchFriendTab(tab) {
            currentFriendTab = tab;
            const tabs = ['search', 'my-qr', 'scan'];
            tabs.forEach(t => {
                const btn = document.getElementById(`friend-tab-${t}`);
                if (t === tab) {
                    btn.className = "font-bold text-blue-600 border-b-2 border-blue-600 pb-1 px-1 transition text-xs";
                } else {
                    btn.className = "font-bold text-gray-400 hover:text-gray-600 pb-1 px-1 transition text-xs";
                }
            });

            // Hide/Show containers
            document.getElementById('friend-search-container').classList.toggle('hidden', tab !== 'search');
            document.getElementById('my-friend-qr-container').classList.toggle('hidden', tab !== 'my-qr');
            document.getElementById('friend-scan-container').classList.toggle('hidden', tab !== 'scan');

            if (tab === 'my-qr') {
                const qrBox = document.getElementById('my-friend-qr-box');
                qrBox.innerHTML = '';
                new QRCode(qrBox, {
                    text: `openboard:add_friend:${currentUser.username}`,
                    width: 170,
                    height: 170,
                    correctLevel : QRCode.CorrectLevel.H
                });
            }

            if (tab !== 'scan') {
                stopCameraScan();
            }
        }

        async function performFriendSearch() {
            const q = document.getElementById('friend-search-input').value.trim();
            if (!q) return alert("请输入要搜索的用户名或昵称！");
            
            const resultsDiv = document.getElementById('friend-search-results');
            resultsDiv.innerHTML = '<div class="text-center py-6 text-gray-400 text-xs animate-pulse">正在搜索...</div>';
            
            try {
                const res = await fetch(`/api/users/search?q=${encodeURIComponent(q)}`, {
                    headers: { 'Authorization': currentUser.token }
                });
                const result = await res.json();
                if (result.status !== 'success') {
                    resultsDiv.innerHTML = '<div class="text-center py-6 text-red-500 text-xs">搜索失败</div>';
                    return;
                }
                
                if (result.data.length === 0) {
                    resultsDiv.innerHTML = '<div class="text-center py-6 text-gray-400 text-xs">未找到匹配的用户</div>';
                    return;
                }
                
                resultsDiv.innerHTML = '';
                result.data.forEach(u => {
                    const name = u.nickname || u.username;
                    const item = document.createElement('div');
                    item.className = "flex items-center justify-between p-2 rounded-xl bg-gray-50 border border-gray-100 hover:bg-gray-100 transition";
                    
                    let actionButtonHtml = '';
                    if (u.is_friend) {
                        actionButtonHtml = '<span class="text-xs text-green-600 bg-green-50 px-2.5 py-1 rounded-lg font-semibold">已是好友</span>';
                    } else if (u.request_status === 'pending') {
                        if (u.request_direction === 'sent') {
                            actionButtonHtml = '<span class="text-xs text-gray-400 bg-gray-100 px-2.5 py-1 rounded-lg font-semibold">等待回复</span>';
                        } else {
                            actionButtonHtml = `
                                <button onclick="respondFriendRequest('${u.username}', 'accept')" class="bg-green-600 text-white text-xs px-2.5 py-1 rounded-lg font-bold hover:bg-green-700 transition">同意</button>
                            `;
                        }
                    } else {
                        actionButtonHtml = `
                            <button onclick="sendFriendRequest('${u.username}')" class="bg-blue-600 text-white text-xs px-2.5 py-1 rounded-lg font-bold hover:bg-blue-700 transition">添加</button>
                        `;
                    }
                    
                    item.innerHTML = `
                        <div class="flex items-center gap-2.5 overflow-hidden">
                            ${getAvatarHtml(u.avatar, name, "w-8 h-8 text-[11px]")}
                            <div class="truncate">
                                <div class="text-xs font-bold text-gray-700 truncate">${name}</div>
                                <div class="text-[9px] text-gray-400 truncate">@${u.username}</div>
                            </div>
                        </div>
                        <div class="shrink-0 ml-2">
                            ${actionButtonHtml}
                        </div>
                    `;
                    resultsDiv.appendChild(item);
                });
            } catch(e) {
                console.error(e);
                resultsDiv.innerHTML = '<div class="text-center py-6 text-red-500 text-xs">请求出错</div>';
            }
        }

        async function sendFriendRequest(username) {
            try {
                const res = await fetch('/api/friends/request', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': currentUser.token 
                    },
                    body: JSON.stringify({ to_user: username })
                });
                const result = await res.json();
                if (res.ok) {
                    showToast(result.msg || "好友申请已发送！");
                    // Refresh search if in search view
                    if (document.getElementById('friend-search-input').value.trim()) {
                        performFriendSearch();
                    }
                } else {
                    alert(result.detail || "发送申请失败");
                }
            } catch(e) {
                console.error(e);
                alert("发送申请发生错误");
            }
        }

        async function showFriendRequestsModal() {
            showModal('friend-requests-modal');
            const listDiv = document.getElementById('friend-requests-list');
            listDiv.innerHTML = '<div class="text-center py-8 text-gray-400 text-xs animate-pulse">正在获取申请列表...</div>';
            
            try {
                const res = await fetch('/api/friends/requests', {
                    headers: { 'Authorization': currentUser.token }
                });
                const result = await res.json();
                if (result.status !== 'success') {
                    listDiv.innerHTML = '<div class="text-center py-8 text-red-500 text-xs">获取列表失败</div>';
                    return;
                }
                
                // Also clear the badge
                document.getElementById('friend-req-badge').classList.add('hidden');
                
                if (result.data.length === 0) {
                    listDiv.innerHTML = '<div class="text-center py-8 text-gray-400 text-xs">暂无未处理的好友申请</div>';
                    return;
                }
                
                listDiv.innerHTML = '';
                result.data.forEach(item => {
                    const name = item.nickname || item.from_user;
                    const reqItem = document.createElement('div');
                    reqItem.className = "flex items-center justify-between p-3 rounded-xl bg-gray-50 border border-gray-100 hover:bg-gray-100 transition";
                    reqItem.innerHTML = `
                        <div class="flex items-center gap-2.5 overflow-hidden">
                            ${getAvatarHtml(item.avatar, name, "w-8 h-8 text-[11px]")}
                            <div class="truncate">
                                <div class="text-xs font-bold text-gray-700 truncate">${name}</div>
                                <div class="text-[9px] text-gray-400 truncate">@${item.from_user}</div>
                            </div>
                        </div>
                        <div class="flex gap-1.5 shrink-0 ml-2">
                            <button onclick="respondFriendRequest('${item.from_user}', 'accept')" class="bg-green-600 hover:bg-green-700 text-white w-7 h-7 rounded-lg flex items-center justify-center text-xs transition" title="同意"><i class="fa-solid fa-check"></i></button>
                            <button onclick="respondFriendRequest('${item.from_user}', 'reject')" class="bg-red-50 hover:bg-red-750 text-white w-7 h-7 rounded-lg flex items-center justify-center text-xs transition" title="拒绝"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    `;
                    listDiv.appendChild(reqItem);
                });
            } catch(e) {
                console.error(e);
                listDiv.innerHTML = '<div class="text-center py-8 text-red-500 text-xs">获取列表发生错误</div>';
            }
        }

        async function respondFriendRequest(username, action) {
            try {
                const res = await fetch('/api/friends/respond', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': currentUser.token
                    },
                    body: JSON.stringify({ from_user: username, action: action })
                });
                const result = await res.json();
                if (res.ok) {
                    showToast(result.msg || "处理成功！");
                    // Reload lists
                    if (document.getElementById('friend-requests-modal').classList.contains('hidden') === false) {
                        showFriendRequestsModal();
                    }
                    if (document.getElementById('search-friends-modal').classList.contains('hidden') === false && document.getElementById('friend-search-input').value.trim()) {
                        performFriendSearch();
                    }
                    loadUsers(); // Refresh friend sidebar list
                } else {
                    alert(result.detail || "操作失败");
                }
            } catch(e) {
                console.error(e);
                alert("处理请求发生错误");
            }
        }

        async function checkPendingFriendRequests() {
            if (!currentUser) return;
            try {
                const res = await fetch('/api/friends/requests', {
                    headers: { 'Authorization': currentUser.token }
                });
                const result = await res.json();
                if (result.status === 'success' && result.data.length > 0) {
                    document.getElementById('friend-req-badge').classList.remove('hidden');
                } else {
                    document.getElementById('friend-req-badge').classList.add('hidden');
                }
            } catch (e) {
                console.error("Failed to check friend requests:", e);
            }
        }

        // --- 扫码加好友逻辑 ---
        function startCameraScan() {
            const placeholder = document.getElementById('qr-reader-placeholder');
            placeholder.innerHTML = '<div class="text-xs text-gray-400 animate-pulse">正在初始化摄像头...</div>';
            
            document.getElementById('btn-stop-scan').classList.remove('hidden');
            
            try {
                html5QrcodeScanner = new Html5Qrcode("qr-reader");
                const qrCodeSuccessCallback = (decodedText, decodedResult) => {
                    console.log(`QR code scan result: ${decodedText}`);
                    stopCameraScan();
                    handleScannedQR(decodedText);
                };
                const config = { fps: 10, qrbox: { width: 180, height: 180 } };
                
                html5QrcodeScanner.start({ facingMode: "environment" }, config, qrCodeSuccessCallback)
                    .then(() => {
                        placeholder.classList.add('hidden');
                    })
                    .catch(err => {
                        console.error("Camera start failed:", err);
                        showToast("摄像头打开失败：" + err);
                        stopCameraScan();
                    });
            } catch (e) {
                console.error("Scanner setup failed:", e);
                showToast("初始化扫码库失败");
                stopCameraScan();
            }
        }

        function stopCameraScan() {
            const placeholder = document.getElementById('qr-reader-placeholder');
            placeholder.classList.remove('hidden');
            placeholder.innerHTML = `
                <i class="fa-solid fa-camera text-3xl"></i>
                <span class="text-[10px]">开启摄像头扫描，或上传二维码图片</span>
                <button onclick="startCameraScan()" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-blue-700 transition">开启摄像头</button>
            `;
            document.getElementById('btn-stop-scan').classList.add('hidden');

            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner = null;
                }).catch(err => {
                    console.error("Failed to stop scanner:", err);
                    html5QrcodeScanner = null;
                });
            }
        }

        function scanQrFile(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            
            const html5QrCode = new Html5Qrcode("qr-reader");
            showToast("正在识别图片...");
            
            html5QrCode.scanFile(file, true)
                .then(decodedText => {
                    handleScannedQR(decodedText);
                })
                .catch(err => {
                    console.error("File scanning error:", err);
                    showToast("无法识别此图片中的二维码，请确认图片清晰度");
                });
        }

        function handleScannedQR(decodedText) {
            if (decodedText.startsWith("openboard:add_friend:")) {
                const username = decodedText.substring("openboard:add_friend:".length).trim();
                if (username === currentUser.username) {
                    showToast("不能添加自己为好友");
                    return;
                }
                switchFriendTab('search');
                document.getElementById('friend-search-input').value = username;
                performFriendSearch();
                showToast(`已成功识别用户 @${username}！`);
            } else {
                showToast("未能识别出 OpenBoard 好友二维码！");
            }
        }

        init();
    </script>
</body>
</html>
