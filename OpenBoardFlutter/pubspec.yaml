name: open_board_mobile
description: OpenBoard cross-platform Flutter client for iOS and Android.
version: 7.7.0+77

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  http: ^1.2.0
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  mobile_scanner: ^5.0.1
  path_provider: ^2.1.2
  intl: ^0.19.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "../OpenBoardHarmony/entry/src/main/resources/base/media/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
